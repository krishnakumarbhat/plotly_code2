langVersion: v1
name: core-radar-gen7-saf85xx-trigger-post-merge
description: Pipeline that is triggered by Gerrit and then launches all downstream pipelines for the project
ui:
  name: core-radar-gen7-saf85xx-trigger-post-merge
params:
  - name: upload-path
    type: string
    default: core_radar-aptiv-00000000-gen7_saf85xx-local/wrsd/saf85xx/post-merge/$(config.pipeline.runNumber)
  - name: change-id
    type: string
    default: ""
  - name: commit-id
    type: string
    default: ""
  - name: gerrit-url
    type: string
    default: https://gitgerrit.asux.aptiv.com
  - name: project-url-encoded
    type: string
    default: Core_Radar_Gen7_SAF85xx
  - name: branch-name
    type: string
    default: dev
  - name: trigger-url
    type: string
    default: $(params.trigger-url)
compute:
  - name: linux-2c8g
    resource: asp-compute-linux-2c8g
  - name: linux-1c4g
    resource: asp-compute-linux-1c4g
tasks:
  - parallelTasks:
      - name: auto-rebase
        task: Utils/ADVRADAR/auto-rebase@1.0.0
        compute: linux-2c8g
        params:
          gerrit-url: $(params.gerrit-url)
          project-name: $(params.project-url-encoded)
          branch: $(params.branch-name)
      - name: update
        task: local/update-pipelines
        compute: linux-1c4g
        params:
          git-ref: $(params.commit-id)
          gerrit-url: $(params.gerrit-url)
          project-name: $(params.project-url-encoded)
  - name: coverity-tests
    task: Utils/YGGDRASIL/custom-run@0.0.1
    compute: linux-1c4g
    params:
      project-name: $(params.project-url-encoded)
      change-id: $(params.change-id)
      commit-id: $(params.commit-id)
      gerrit-url: $(params.gerrit-url)
      parameters:
        change-id: $(params.change-id)
        commit-id: $(params.commit-id)
        gerrit-url: $(params.gerrit-url)
        project-url-encoded: $(params.project-url-encoded)
        upload-path: $(params.upload-path)/coverity/
      target-pipeline: core-radar-gen7-saf85xx-coverity
      yaml_path: tools/CI/WRSD/core-radar-gen7-saf85xx-coverity.yaml
final:
  - name: grafana-publish-metrics-platform-flr7v2
    task: Utils/grafana-publish-metrics@1.0.0
    params:
      image: $(studio.systemRegistry)/devsecops/dashboard:1.0
      netrccreds: $(secrets.netrc)
      patchset-revision: dev
      pipeline-type: post-merge
      project-name: core-radar-gen7-saf85xx-trigger-nightly
      scm:
        branch-name: feature/sw-quality
        repo-name: 00000000_wrsd/metrics
      shebang: '#!/usr/bin/env python3'
defineTasks:
  - langVersion: v1
    name: update-pipelines
    category: local
    params:
      - name: git-ref
        type: string
        description: The git commit hash or branch to check out from Gerrit
        default: dev
        ui:
          name: Commit Hash or Branch
      - name: gerrit-url
        type: string
        default: https://gitgerrit.asux.aptiv.com
      - name: project-name
        type: string
        default: Core_Radar_Gen7_SAF85xx
    steps:
      - name: shallow-clone
        task: Utils/YGGDRASIL/git-shallow-clone@0.0.3
        params:
          depth: "1"
          repository:
            git-ref: $(params.git-ref)
            password: $(secrets.gerrit-cred.password.path)
            url: $(params.gerrit-url)/$(params.project-name)
            username: $(secrets.gerrit-cred.username.path)
        WhenVal: false
      - name: studio-update-pipelines
        task: Utils/studio-cli@1.0.0
        params:
          overrides:
            plm_URIBASE: $(studio.plmURIBase)
          script: |
            cd $(params.project-name)/tools/CI/WRSD
            studio-cli plm pipeline update --name "core-radar-gen7-saf85xx-build" -f "core-radar-gen7-saf85xx-build.yaml"
            studio-cli plm pipeline update --name "core-radar-gen7-saf85xx-coverity" -f "core-radar-gen7-saf85xx-coverity.yaml"
            studio-cli plm pipeline update --name "core-radar-gen7-saf85xx-dynamic-analysis" -f "core-radar-gen7-saf85xx-dynamic-analysis.yaml"
            studio-cli plm pipeline update --name "core-radar-gen7-saf85xx-hw-test" -f "core-radar-gen7-saf85xx-hw-test.yaml"
            studio-cli plm pipeline update --name "core-radar-gen7-saf85xx-itf" -f "core-radar-gen7-saf85xx-itf.yaml"
            studio-cli plm pipeline update --name "core-radar-gen7-saf85xx-precommit-check" -f "core-radar-gen7-saf85xx-precommit-check.yaml"
            studio-cli plm pipeline update --name "core-radar-gen7-saf85xx-trigger-nightly" -f "core-radar-gen7-saf85xx-trigger-nightly.yaml"
            studio-cli plm pipeline update --name "core-radar-gen7-saf85xx-trigger-post-merge" -f "core-radar-gen7-saf85xx-trigger-post-merge.yaml"
            studio-cli plm pipeline update --name "core-radar-gen7-saf85xx-trigger-verification" -f "core-radar-gen7-saf85xx-trigger-verification.yaml"
            studio-cli plm pipeline update --name "core-radar-gen7-saf85xx-unit-test" -f "core-radar-gen7-saf85xx-unit-test.yaml"
            studio-cli plm trigger update -f "saf85xx-trigger-verification.yaml"
            studio-cli plm trigger update -f "saf85xx-post-merge-trigger.yaml"
        WhenVal: false
    wrrn: ""
storage:
  - name: shared
    defaultMount: true
    mountPath: /volumes/shared
    readOnly: false
    resource: core-radar-gen7-saf85xx
timeout: 8h
