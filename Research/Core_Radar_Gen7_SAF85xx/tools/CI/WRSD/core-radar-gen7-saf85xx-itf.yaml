    steps:
      - name: build
        image: system.registry.389177498442.awsaptiv.com/aptiv-core-radar/build-format-ready:2.0
        script: |
          #!/bin/bash

          echo repoRoot = $(params.repoRoot)
          echo repoRoot = $(params.variant)
          cd $(params.repoRoot)
          git config --global --add safe.directory $(params.repoRoot)
          cp $(secrets.netrc.path) ~/.netrc

          echo "build --bes_header=x-arb-api-key=$(cat $(secrets.arb-token.path))" > user.bazelrc
          echo "build --remote_header=x-arb-api-key=$(cat $(secrets.arb-token.path))" >> user.bazelrc

          # Path to the build event JSON file
          BUILD_EVENT_FILE="build_event.json"

          bazelisk --output_user_root=$(params.repoRoot)/bazel_output build //:gen7 --color=no --jenkins --gitBranch=$(params.git-ref) --variant=$(params.variant) --jobs=auto --board=A1 --micro_revision=ES2 --build_event_json_file="$BUILD_EVENT_FILE"

          # Capture the exit status of the bazelisk command
          BAZEL_EXIT_CODE=$?

          # Extract the invocation ID using jq
          INVOCATION_ID=$(grep -Po '"uuid":"\K[^"]+' build_event.json)

          # Check if the invocation ID is not empty
          if [[ -n "$INVOCATION_ID" ]]; then
              echo "Invocation ID: $INVOCATION_ID"

              # Create the RapidBuild url
              echo -n "https://rapidbuild.asux.aptiv.com/organizations/gpo/projects/core_radar_gen7_saf85xx/invocations/${INVOCATION_ID}" > $(results.rapid-build-url.path)
          fi

          # Check if the build passed or failed
          if [ $BAZEL_EXIT_CODE -eq 0 ]; then
              echo "----------------------------------"
              echo "Build completed successfully."
              echo "----------------------------------"
          else
              echo "----------------------------------"
              echo "Build failed with exit code $BAZEL_EXIT_CODE."
              echo "----------------------------------"
              # Optionally, you can exit the script with a non-zero status to indicate failure
              exit 1
          fi

          # save output directory path for user usages
          echo -n "$(params.repoRoot)/bazel-bin/outputs" > $(results.outputDir.path)
        onError: continue
        ComputeResources: {}
        SecurityContext:
        Storage:
        WhenVal: false
      - name: save-exit-code
        image: system.registry.389177498442.awsaptiv.com/aptiv-core-radar/build-format-ready:2.0
        script: |
          echo -n $(cat $(steps.build.exitCode.path)) > $(results.exit-code.path)
        ComputeResources: {}
        SecurityContext:
        Storage:
        WhenVal: false
    wrrn: ""

timeout: 1h
