    steps:
      - name: download-report-files
        task: core-radar-jfrog-download
        params:
          downloadPath: $(params.report-files-path)
          destinationPath: $(params.destination-path)
        WhenVal: false
        returnResults:
          exit-code: exit-code

      - name: publish
        image: system.registry.389177498442.awsaptiv.com/aptiv-core-radar/build-format-ready:2.0
        script: |
          #!/usr/bin/env python3

          import subprocess
          import sys
          import os
          import zipfile
          import re

          TARGET = "/tmp/python-packages"
          MARKER = os.path.join(TARGET, ".deps_installed")

          if TARGET not in sys.path:
              sys.path.insert(0, TARGET)

          def install_deps_and_restart():
              subprocess.check_call([
                  sys.executable, "-m", "pip", "install",
                  "--break-system-packages",
                  "--no-cache-dir",
                  "--target", TARGET,
                  "psycopg2-binary"
              ])

              os.makedirs(TARGET, exist_ok=True)
              with open(MARKER, "w"):
                  pass

              os.execv(sys.executable, [sys.executable] + sys.argv)

          if not os.path.exists(MARKER):
              print("Installing Python dependencies...")
              install_deps_and_restart()

          import psycopg2

          from psycopg2 import sql, extras
          from datetime import datetime
          from psycopg2.extras import Json

          def insert_wrsd_tags(cursor, wrsd_tags):
              """
              Inserts or retrieves an existing wrsd_tags ID from perception_metrics_wrsd.
              """
              # Check if the wrsd_tags entry already exists
              cursor.execute("""
                  SELECT id FROM wrsd."perception_metrics_wrsd"
                  WHERE build_no = %s AND pipeline_name = %s;
              """, (wrsd_tags['build_no'], wrsd_tags['pipeline_name']))
              result = cursor.fetchone()
              # If exists, return id, else insert new and return new id
              if result:
                  print("WRSD entry already exists")
                  return result[0]
              else:
                  print("Creating a new WRSD entry")

                  cursor.execute("""
                      INSERT INTO wrsd."perception_metrics_wrsd" (build_no, pipeline_name, status, duration, build_url)
                      VALUES (%s, %s, %s, %s, %s) RETURNING id;
                  """, (wrsd_tags['build_no'], wrsd_tags['pipeline_name'], wrsd_tags['status'], wrsd_tags['duration'], wrsd_tags['build_url']))
                  result = cursor.fetchone()[0]

                  return result

          def insert_perception_metrics(cursor, data_list):
              """
              Inserts multiple perception_metrics entries into the database.

              Parameters:
                  data_list (list of dict): List of dictionaries, each containing data for a single entry.
              """
              for data in data_list:
                  # First, insert or get the wrsd_tags ID
                  wrsd_id = insert_wrsd_tags(cursor, data['wrsd_tags'])

                  # Insert into PerceptionMetrics with reference to wrsd_id
                  cursor.execute("""
                      INSERT INTO wrsd."perception_metrics" ("CommitId", date, branch, tag, project, metric_name, metric_value, metric_tags, wrsd_id)
                      VALUES (%s, %s, %s, %s, %s, %s, %s, %s, %s);
                  """, (
                      data['commitid'],
                      data['date'],
                      data['branch'],
                      data['tag'],
                      data['project'],
                      data['metric_name'],
                      data['metric_value'],
                      Json(data['metric_tags']),
                      wrsd_id
                  ))

          def read_file(file_path):
              """Read and return the contents of a file."""
              with open(os.path.expandvars(file_path), 'r') as file:
                  return file.read().strip()

          def parse_integration_test_summary(file_path):
              """
              Parse the integration test summary file and extract metrics.
              """

              if not os.path.exists(file_path):
                  raise FileNotFoundError(f"The file '{file_path}' does not exist.")

              with open(file_path, 'r') as file:
                  lines = file.readlines()

              data = {}
              cycle_results = []

              # Parse the configuration data
              for line in lines:
                  if line.startswith("Test Name:"):
                      data["test_name"] = line.split(":", 1)[1].strip()
                  elif line.startswith("Variant:"):
                      data["variant"] = line.split(":", 1)[1].strip()
                  elif line.startswith("Test ID:"):
                      data["test_id"] = line.split(":", 1)[1].strip()
                  elif line.startswith("Platform ID:"):
                      data["platform_id"] = line.split(":", 1)[1].strip()
                  elif line.startswith("Software ID:"):
                      data["software_id"] = line.split(":", 1)[1].strip()
                  elif line.startswith("Date of Test:"):
                      data["test_date"] = line.split(":", 1)[1].strip()
                  elif line.startswith("Test Duration(min):"):
                      data["test_duration"] = float(line.split(":", 1)[1].strip())
                  elif line.startswith("Overall Pass/Fail:"):
                      pass_fail = line.split(":")[1].strip().split("/")
                      data["overall_pass"] = int(pass_fail[0])
                      data["overall_fail"] = int(pass_fail[1])
                  elif line.startswith("Testcase Pass/Fail:"):
                      pass_fail = line.split(":")[1].strip().split("/")
                      data["testcase_pass"] = int(pass_fail[0])
                      data["testcase_fail"] = int(pass_fail[1])

              # Parse per-testcase results in Cycle 1
              cycle_start = False
              for line in lines:
                  if "Cycle 1" in line:
                      cycle_start = True
                      continue
                  if cycle_start:
                      match = re.match(r"^\s*(\S+)\s+(\d+)\s*/\s*(\d+)\s+(\S+)", line)
                      if match:
                          testcase, passed, total, result = match.groups()
                          cycle_results.append({
                              "testcase": testcase,
                              "passed": int(passed),
                              "total": int(total),
                              "result": result
                          })

              data["cycle_results"] = cycle_results
              return data

          def package_integration_test_data(base_data, report_data):
              """
              Package parsed integration test report data into a list for database insertion.

              Parameters:
                  base_data (dict): Base data containing common metadata like commit ID, branch, etc.
                  report_data (dict): Parsed data from the integration test report.

              Returns:
                  list: A list of dictionaries ready for database insertion.
              """
              data_list = []


              # Add overall metrics
              data_list.extend([
                  {
                      **base_data,
                      "metric_name": "itf.results.overall_pass",
                      "metric_tags": {
                          "test_name": report_data["test_name"],
                          "variant": report_data["variant"],
                          "test_id": report_data["test_id"],
                          "software_id": report_data["software_id"]
                      },
                      "metric_value": report_data["overall_pass"]

                  },
                  {
                      **base_data,
                      "metric_name": "itf.results.overall_fail",
                      "metric_tags": {
                          "test_name": report_data["test_name"],
                          "variant": report_data["variant"],
                          "test_id": report_data["test_id"]
                      },
                      "metric_value": report_data["overall_fail"]
                  },
                  {
                      **base_data,
                      "metric_name": "itf.results.testcase_pass",
                      "metric_tags": {
                          "test_name": report_data["test_name"],
                          "variant": report_data["variant"],
                          "test_id": report_data["test_id"]
                      },
                      "metric_value": report_data["testcase_pass"]
                  },
                  {
                      **base_data,
                      "metric_name": "itf.results.testcase_fail",
                      "metric_tags": {
                          "test_name": report_data["test_name"],
                          "variant": report_data["variant"],
                          "test_id": report_data["test_id"]
                      },
                      "metric_value": report_data["testcase_fail"]
                  }
              ])

              # Add per-testcase results
              for cycle_result in report_data["cycle_results"]:
                  data_list.append({
                      **base_data,
                      "metric_name": "itf.results.cycle_results.pass",
                      "metric_tags": {
                          "testcase": cycle_result["testcase"],
                          "variant": report_data["variant"],
                          "testcase": cycle_result["testcase"],
                          "result": cycle_result["result"]
                      },
                      "metric_value": cycle_result["passed"]
                  })
                  data_list.append({
                      **base_data,
                      "metric_name": "itf.results.cycle_results.total",
                      "metric_tags": {
                          "testcase": cycle_result["testcase"],
                          "variant": report_data["variant"],
                          "testcase": cycle_result["testcase"],
                          "result": cycle_result["result"]
                      },
                      "metric_value": cycle_result["total"]
                  })

              return data_list

          def get_report_file(destination_path, extract_base="/tmp"):
            """Find and extract memoryStats.txt and flash_memory_stats.txt from a ZIP file."""
            report_file = "Integration_Test_Summary.txt"

            print(f"Searching for ZIP in workspace: {destination_path}")

            for fname in os.listdir(destination_path):
              if fname.lower().endswith(".zip"):
                zip_file_path = os.path.join(destination_path, fname)
                extract_folder = os.path.join(extract_base, os.path.splitext(fname)[0])

                print(f"Extracting {zip_file_path} to {extract_folder}")
                os.makedirs(extract_folder, exist_ok=True)

                with zipfile.ZipFile(zip_file_path, 'r') as zip_ref:
                  zip_ref.extractall(extract_folder)

                for root,dirs,files in os.walk(extract_folder):
                  if report_file in files:
                    print(f"Found files: {report_file}")
                    return (os.path.join(root,report_file))

            raise FileNotFoundError(
              f"No ZIP file found in workspace directory: {destination_path}"
            )

          # Database connection details
          pg_user = read_file(r'$(secrets.postgresql-auth.username.path)')
          pg_pass = read_file(r'$(secrets.postgresql-auth.password.path)')

          db_config = {
              "dbname": "monitoring",
              "user": pg_user,
              "password": pg_pass,
              "host": "monitoring-wrds.c9qq8e0oklwk.eu-central-1.rds.amazonaws.com",
              "port": "5432"
          }

          build_name = "$(config.pipeline.name)"
          build_no = $(config.pipeline.runNumber)
          build_url = f"https://$(studio.home)/plm/view/{build_name}/runs/{build_no}"
          variant = "$(params.variant)"
          branch = "$(params.git-ref)"
          project_name = "$(params.project-name)"
          commit_hash = "$(params.commit-hash)"
          report_path = 'Integration_Test_Summary.txt'

          now = datetime.now()
          currentDateTime = now.strftime("%Y-%m-%d %H:%M:%S")

          wrsd_tags = {
              "build_no": build_no,
              "pipeline_name": build_name,
              "status": None,
              "duration": None,
              "build_url": build_url
          }

          base_data = {
              "commitid": commit_hash,
              "date": currentDateTime,
              "branch": branch,
              "tag": "",
              "project": project_name,
              "wrsd_tags": wrsd_tags
          }


          if branch == "dev":
              # Get the report text file from the zipped up report folder
              report_path = get_report_file("$(params.destination-path)")

              # Parse the test summary file
              parsed_report = parse_integration_test_summary(report_path)

              # Package data for PostgreSQL
              data_list = package_integration_test_data(base_data, parsed_report)

              print(f"Submitting {len(data_list)} memory records for {variant} .")
              print(data_list)
              try:
                  connection = psycopg2.connect(**db_config)
                  cursor = connection.cursor()

                  # Insert multiple data entries
                  insert_perception_metrics(cursor, data_list)
                  connection.commit()
                  print("Data inserted successfully.")

              except Exception as e:
                  print("An error occurred:", e)

              finally:
                  if connection:
                      cursor.close()
                      connection.close()
          else:
              print("Not Dev branch so nothing will be commited to Platform Health.")

        onError: continue
        ComputeResources: {}
        SecurityContext:
        Storage:
        WhenVal: false
    wrrn: ""

