langVersion: v1
name: core-radar-gen7-saf85xx-unit-test
description: Pipeline that unit tests all variants of the code for Gen7 AWR294x
ui:
  name: core-radar-gen7-saf85xx-unit-test
params:
  - name: change-id
    type: string
    default: ""
  - name: commit-id
    type: string
    default: dev
  - name: gerrit-url
    type: string
    default: https://gitgerrit.asux.aptiv.com
  - name: project-url-encoded
    type: string
    default: Core_Radar_Gen7_SAF85xx
  - name: upload-path
    type: string
    description: |-
      The path inside of JFrog to upload the outputs to. Note - this does not include the base URL of the JFrog Artifactory
      Ex. core_radar-aptiv-00000000-gen7_awr294x-local/reviews/45/12345/6/unitTests/
    default: "core_radar-aptiv-00000000-gen7_saf85xx-local/wrsd/saf85xx/manual/0/unitTests/"
    ui:
      name: JFrog Upload Path
  - name: branch-name
    type: string
    default: dev
  - name: change-url
    type: string
    default: ""
  - name: patchset-id
    type: string
    default: ""
compute:
  - name: linux-16c64g
    resource: asp-compute-linux-16c64g
  - name: linux-8c32g
    resource: asp-compute-linux-8c32g
  - name: linux-2c8g
    resource: asp-compute-linux-2c8g
  - name: linux-1c4g
    resource: asp-compute-linux-1c4g
  - resource: asp-compute-linux-1c4g # This becomes the default compute.
containerSettings:
  - name: container-16c64g300g
    resource: asp-container-16c64g300g
  - name: container-8c32g150g
    resource: asp-container-8c32g150g
  - name: container-2c8g50g
    resource: asp-container-2c8g50g
  - name: container-1c4g25g
    resource: asp-container-1c4g25g
tasks:
  - name: publish-run
    task: Utils/core-radar-publish-run@0.1.1

  - parallelTasks:
      - name: ut-srr7p
        task: build/unit-test
        params:
          git-ref: $(params.commit-id)
          upload-path: $(params.upload-path)
          variant: srr7p
        steps:
          - name: unit-test-code
            steps:
              - name: unit-test
                containerSettings: container-16c64g300g

      - name: ut-flr7
        task: build/unit-test
        params:
          git-ref: $(params.commit-id)
          upload-path: $(params.upload-path)
          variant: flr7
        steps:
          - name: unit-test-code
            steps:
              - name: unit-test
                containerSettings: container-16c64g300g

  - name: prepare-vote-and-message
    task: Utils/prepare-vote-and-message
    params:
      branch-coverages:
        FLR7: $(tasks.ut-flr7.results.branch-coverage)
        SRR7p: $(tasks.ut-srr7p.results.branch-coverage)
      build-exit-codes:
        FLR7: $(tasks.ut-flr7.results.build-exit-code)
        SRR7p: $(tasks.ut-srr7p.results.build-exit-code)
      decision-coverages:
        FLR7: $(tasks.ut-flr7.results.decision-coverage)
        SRR7p: $(tasks.ut-srr7p.results.decision-coverage)
      error-messages:
        FLR7: $(tasks.ut-flr7.results.error-message)
        SRR7p: $(tasks.ut-srr7p.results.error-message)
      function-coverages:
        FLR7: $(tasks.ut-flr7.results.function-coverage)
        SRR7p: $(tasks.ut-srr7p.results.function-coverage)
      line-coverages:
        FLR7: $(tasks.ut-flr7.results.line-coverage)
        SRR7p: $(tasks.ut-srr7p.results.line-coverage)
      unit-test-exit-codes:
        FLR7: $(tasks.ut-flr7.results.unit-test-exit-code)
        SRR7p: $(tasks.ut-srr7p.results.unit-test-exit-code)
      untested-files:
        FLR7: $(tasks.ut-flr7.results.untested-files)
        SRR7p: $(tasks.ut-srr7p.results.untested-files)
      true-counts:
        FLR7: $(tasks.ut-flr7.results.true-count)
        SRR7p: $(tasks.ut-srr7p.results.true-count)
      false-counts:
        FLR7: $(tasks.ut-flr7.results.false-count)
        SRR7p: $(tasks.ut-srr7p.results.false-count)
      upload-exit-codes:
        FLR7: $(tasks.ut-flr7.results.upload-exit-code)
        SRR7p: $(tasks.ut-srr7p.results.upload-exit-code)
  - name: unit-test-vote
    task: Utils/ADVRADAR/post-gerrit-comment-vote@1.0.0
    compute: linux-1c4g
    params:
      gerrit-setup: {}
      message: |-
        $(tasks.prepare-vote-and-message.results.vote-message)

        Build Outputs: https://jfrog.asux.aptiv.com/ui/repos/tree/General/$(params.upload-path)

        Build Job: https://$(studio.home)/plm/view/$(config.pipeline.name)/runs/$(config.pipeline.runNumber)
      votes:
        Unit-Test: $(tasks.prepare-vote-and-message.results.vote-value)

  - parallelTasks:
      - name: publish-metrics-srr7p
        task: Utils/publish-metrics
        when:
          - input: $(params.commit-id)
            operator: in
            values:
              - dev
        params:
          variant: srr7p
          git-ref: $(params.commit-id)
          branch-coverage: $(tasks.ut-srr7p.results.branch-coverage)
          decision-coverage: $(tasks.ut-srr7p.results.decision-coverage)
          function-coverage: $(tasks.ut-srr7p.results.function-coverage)
          line-coverage: $(tasks.ut-srr7p.results.line-coverage)
          untested-files: $(tasks.ut-srr7p.results.untested-files)
          project-name: $(params.project-url-encoded)
          commit-hash: $(tasks.ut-srr7p.results.commit-hash)
          ut-files-path: $(tasks.ut-srr7p.results.jf-upload-path)
          destination-path: /workspace/Core_Radar_Gen7_SAF85xx/
          tags: "buildVariant=satellite"
      - name: publish-metrics-flr7
        task: Utils/publish-metrics
        when:
          - input: $(params.commit-id)
            operator: in
            values:
              - dev
        params:
          variant: flr7
          git-ref: $(params.commit-id)
          branch-coverage: $(tasks.ut-flr7.results.branch-coverage)
          decision-coverage: $(tasks.ut-flr7.results.decision-coverage)
          function-coverage: $(tasks.ut-flr7.results.function-coverage)
          line-coverage: $(tasks.ut-flr7.results.line-coverage)
          untested-files: $(tasks.ut-flr7.results.untested-files)
          project-name: $(params.project-url-encoded)
          commit-hash: $(tasks.ut-srr7p.results.commit-hash)
          ut-files-path: $(tasks.ut-flr7.results.jf-upload-path)
          destination-path: /workspace/Core_Radar_Gen7_SAF85xx/
          tags: "buildVariant=satellite"
      - name: auto-submit-check
        task: Utils/ADVRADAR/auto-submit@1.0.1
        params:
          project-name: $(params.project-url-encoded)
          change-id: $(params.change-id)
          gerrit-url: $(params.gerrit-url)
          comment: "False"

defineTasks:
  - langVersion: v1
    name: unit-test
    category: build
    params:
      - name: git-ref
        type: string
        description: The git commit hash or branch to check out from Gerrit
        default: dev
        ui:
          name: Commit Hash or Branch
      - name: variant
        type: select
        description: Variant to Unit Test
        ui:
          name: variant
        options:
          - name: srr7p
            description: Variant is SRR7p
            value: srr7p
          - name: flr7
            description: Variant is FLR7
            value: flr7
      - name: upload-path
        type: string
        description: |-
          The path inside of JFrog to upload the outputs to. Note - this does not include the base URL of the repository
          Ex. core_radar-aptiv-00000000-gen7_awr294x-local/reviews/45/12345/6/buildFiles
        default: ""
        ui:
          name: JFrog Upload Path
    results:
      - name: jf-upload-url
        description: The URL the outputs are uploaded to.
      - name: jf-upload-path
        description: The path the outputs are uploaded to.
      - name: unit-test-exit-code
        description: The exit code of the unit test step
      - name: upload-exit-code
        description: The exit code of the upload step
      - name: branch-coverage
        description: The branch coverage calculated from UT
      - name: line-coverage
        description: The line coverage calculated from UT
      - name: function-coverage
        description: The function coverage calculated from UT
      - name: decision-coverage
        description: The decision coverage calculated from UT
      - name: untested-files
        description: The number of source files not covered by UT
      - name: true-count
        description: The number of UT functions that have asserts/expects
      - name: false-count
        description: The number of UT functions that do not have asserts/expects
      - name: error-message
        description: The failed unit tests
      - name: commit-hash
        description: commit-hash
      - name: rapid-build-url
        description: URL to the RapidBuild
    steps:
      - name: clone-awr-repo
        task: clone-awr-repo
        params:
          git-ref: $(params.git-ref)
        WhenVal: false
        returnResults:
          commit-hash: commit-hash
      - name: unit-test-code
        task: unit-test-code
        params:
          repoRoot: $(cat $(steps.clone-awr-repo.results.repoPath.path))
          variant: $(params.variant)
        WhenVal: false
        returnResults:
          branch-coverage: branch-coverage
          decision-coverage: decision-coverage
          error-message: error-message
          exit-code: unit-test-exit-code
          function-coverage: function-coverage
          line-coverage: line-coverage
          true-count: true-count
          false-count: false-count
          untested-files: untested-files
          rapid-build-url: rapid-build-url
          unstable: unstable
      - name: upload-files
        task: Utils/ADVRADAR/core-radar-jfrog-upload@1.0.1
        params:
          pathToUpload: $(cat $(steps.unit-test-code.results.outputDir.path))
          uploadPath: $(params.upload-path)unitTests_$(params.variant)
        WhenVal: false
        returnResults:
          exit-code: upload-exit-code
          uploadUrl: jf-upload-url
          jf-upload-path: jf-upload-path
          unstable: unstable
    wrrn: ""
  - langVersion: v1
    name: unit-test-code
    category: build
    params:
      - name: repoRoot
        type: string
        description: Path to the root of the repo
        ui:
          name: repoRoot
      - name: variant
        type: string
        description: Variant to Unit Test
        ui:
          name: variant
    results:
      - name: outputDir
        description: Path to the directory that contains the output files/folders
      - name: exit-code
        description: Exit code to provide to any downstream tasks
      - name: branch-coverage
        description: Branch coverage results from UT
      - name: function-coverage
        description: Function coverage results from UT
      - name: line-coverage
        description: Line coverage results from UT
      - name: decision-coverage
        description: Decision coverage results from UT
      - name: untested-files
        description: The number of source files not covered by UT
      - name: false-count
        description: The False UT function count
      - name: true-count
        description: The True UT function count
      - name: error-message
        description: Failed testcases from build log
      - name: rapid-build-url
        description: URL to the RapidBuild
      - name: unstable
    steps:
      - name: unit-test
        image: system.registry.389177498442.awsaptiv.com/aptiv-core-radar/build-format-ready:2.0
        script: |
          #!/bin/bash
          echo repoRoot = $(params.repoRoot)
          echo variant = $(params.variant)
          cd $(params.repoRoot)
          git config --global --add safe.directory $(params.repoRoot)
          cp $(secrets.netrc.path) ~/.netrc

          # Path to the build event JSON file
          BUILD_EVENT_FILE="build_event.json"

          echo "build --bes_header=x-arb-api-key=$(cat $(secrets.arb-token.path))" > user.bazelrc
          echo "build --remote_header=x-arb-api-key=$(cat $(secrets.arb-token.path))" >> user.bazelrc

          # Start showing the commands now that all the secrets are finished:
          set -x
          # variables to store report data
          branch_coverage=""
          function_coverage=""
          line_coverage=""
          decision_coverage=""
          untested_files=""
          report_file="report.txt"
          coverage_target="//coverage:report"
          jobStatus=0

          total_true="0"
          total_false="0"
          total_tests="0"
          total_coverage="0"

          # Create the test results folder
          mkdir -p test-results/$(params.variant)
          mkdir -p test-results/$(params.variant)/profile

          echo "----------------------------------"
          echo "Running UT Command"
          echo "----------------------------------"
          bazelisk test $coverage_target --variant=$(params.variant)  --build_event_json_file="$BUILD_EVENT_FILE" 2>&1 | tee build_output.log

          # Capture the exit status of the bazelisk command
          BAZEL_EXIT_CODE=${PIPESTATUS[0]}
          build_output=$(cat build_output.log)

          # Extract the invocation ID using jq
          INVOCATION_ID=$(grep -Po '"uuid":"\K[^"]+' build_event.json)

          # Check if the invocation ID is not empty
          if [[ -n "$INVOCATION_ID" ]]; then
              echo "Invocation ID: $INVOCATION_ID"

              # Create the RapidBuild url
              echo -n "https://rapidbuild.asux.aptiv.com/organizations/gpo/projects/core_radar_gen7_saf85xx/invocations/${INVOCATION_ID}" > $(results.rapid-build-url.path)
          fi

          # Check if the build passed or failed
          if [ $BAZEL_EXIT_CODE -eq 0 ]; then
              echo "----------------------------------"
              echo "Unit Test build completed successfully."
              echo "----------------------------------"
          else
              echo "----------------------------------"
              echo "Unit Test build failed with exit code $BAZEL_EXIT_CODE."

              # Search for the line where tests fail and capture the number of failed tests
              if echo "$build_output" | grep -E -q '\[\s*FAILED\s*\]\s*[0-9]+ tests, listed below:'; then
                  # Extract the number of failed tests
                  num_failed=$(echo "$build_output" | grep -E '\[  FAILED  \] [0-9]+ tests, listed below:' | grep -E -o '[0-9]+')

                  # Print the header and the failed test cases
                  echo "----------------------------------"
                  echo "****** $num_failed FAILED TESTS DETECTED ******"
                  # Extract the block starting from the failed line and the next N failed test lines
                  awk -v nf="$num_failed" '
                  /\[  FAILED  \] '"$num_failed"' tests, listed below:/ {found=1; n=0; gsub(":", ""); print; next}
                  found && n < nf {gsub(":", ""); print; n++}
                  found && n >= nf {exit}
                  ' <<< "$build_output" | tee -a "$(results.error-message.path)"
                  echo "----------------------------------"
                  jobStatus=2 # Custom status to indicate unit test failure

              # Additional check for coverage-related failures, even if exit code is 0
              elif echo "$build_output" | grep -q "CoverageReport.*failed" || echo "$build_output" | grep -q "Exit 1"; then
                  echo "----------------------------------"
                  echo "****** COVERAGE LIMIT FAILURE DETECTED ******"
                  # Extract only the coverage results table
                  echo "$build_output" | awk '/Coverage results/,/Untested source files/ { if ($0 ~ /Untested source files/) exit; print }' | tee -a $(results.error-message.path)
                  echo "----------------------------------"
                  jobStatus=3  # Custom status to indicate coverage limit failure

              else
                  echo "----------------------------------"
                  echo "No failed tests found"
                  echo "----------------------------------"
                  # Exit the script with a non-zero status to indicate failure
                  jobStatus=1
              fi
          fi

          if [ "$jobStatus" -eq 0 ]; then # if jobStatus is 0 then process the reports
              cp -r bazel-Core_Radar_Gen7_SAF85xx/external/ external/

              mkdir -p test-results/$(params.variant)/coverage
              mv bazel-bin/coverage/report_html test-results/$(params.variant)/coverage
              mv bazel-bin/coverage/report.txt  test-results/$(params.variant)/$report_file
              mv bazel-bin/coverage/report_gcovr_report.json  test-results/$(params.variant)/report_gcovr_report.json

              echo "--------------------------------------"
              # Parse the report.txt for coverage values and number of untested files

              if [[ ! -f "test-results/$(params.variant)/$report_file" ]]; then
                echo "Error: File '$report_file' not found!"
                exit 1
              fi

              while IFS= read -r line; do
                # check
                if [[ "$line" == *"$coverage_target"* ]]; then
                  echo "Found Coverage Line"

                  # Split the line by '|' and assign coverage numbers (ignoring the first 2 fields)
                  IFS='|' read -r _ _ line_coverage _ decision_coverage _ function_coverage _ branch_coverage _ <<< "$line"

                  # Trim leading/trailing whitespaces
                  line_coverage=$(echo "$line_coverage" | xargs)
                  decision_coverage=$(echo "$decision_coverage" | xargs)
                  function_coverage=$(echo "$function_coverage" | xargs)
                  branch_coverage=$(echo "$branch_coverage" | xargs)
                fi

                # Check if the line contains "Untested source files"
                if [[ "$line" == *"Untested source files"* ]]; then
                    # Extract the number between parentheses
                    untested_files=$(echo "$line" | grep -oP '(?<=\().*(?=\))')
                fi

              done < "test-results/$(params.variant)/$report_file"

          fi

          # This runs the True Count python script. It generates two files outputs.
          ./bazelisk run //tools/python/unitTestTrueCount:getUTTrueCount

          if [ -f "ut_true_count_report.json" ]; then
            mv ut_true_count_report.json test-results/$(params.variant)/ut_true_count_report.json
            mv ut_true_count_report.xlsx test-results/$(params.variant)/ut_true_count_report.xlsx

            TRUE_COUNT_JSON_FILE="test-results/$(params.variant)/ut_true_count_report.json"

            # Check if the true count file exists before attempting to extract values
            if [[ -f "$TRUE_COUNT_JSON_FILE" ]]; then
                total_true=$(grep -o '"total_true":[ ]*[0-9]*' "$TRUE_COUNT_JSON_FILE" | awk -F: '{sum += $2} END {print sum+0}')
                total_false=$(grep -o '"total_false":[ ]*[0-9]*' "$TRUE_COUNT_JSON_FILE" | awk -F: '{sum += $2} END {print sum+0}')
                total_tests=$(grep -o '"total_tests":[ ]*[0-9]*' "$TRUE_COUNT_JSON_FILE" | awk -F: '{sum += $2} END {print sum+0}')
                total_coverage=$(grep -o '"total_coverage":[ ]*[0-9.]*' "$TRUE_COUNT_JSON_FILE" | awk -F: '{sum += $2} END {print sum+0}')
            else
                echo "Warning: JSON file '$TRUE_COUNT_JSON_FILE' not found. Defaulting values to 0."
            fi
          fi

          echo "Line Coverage: $line_coverage"
          echo "Decision Coverage: $decision_coverage"
          echo "Function Coverage: $function_coverage"
          echo "Branch Coverage: $branch_coverage"
          echo "Untested Source Files: $untested_files"
          echo "True UT Function Count: $total_true"
          echo "False UT Function Count: $total_false"

          echo "-------------------------------------"
          # Populate the result variables
          echo -n "$branch_coverage" > $(results.branch-coverage.path)
          echo -n "$function_coverage" > $(results.function-coverage.path)
          echo -n "$line_coverage" > $(results.line-coverage.path)
          echo -n "$decision_coverage" > $(results.decision-coverage.path)
          echo -n "$untested_files" > $(results.untested-files.path)
          echo -n "$total_true" > $(results.true-count.path)
          echo -n "$total_false" > $(results.false-count.path)

          echo -n "" >> $(results.error-message.path)

          # save output directory path for user usages
          echo -n "$(params.repoRoot)/test-results/" > $(results.outputDir.path)

          if [ "$jobStatus" -ne 0 ]; then
              exit "$jobStatus"
          fi
        onError: continue
        ComputeResources: {}
        SecurityContext:
        Storage:
        WhenVal: false
      - name: save-exit-code
        image: system.registry.389177498442.awsaptiv.com/luci/gut-ready:1.4
        script: |
          echo -n $(cat $(steps.unit-test.exitCode.path)) > $(results.exit-code.path)
          if [ $(cat $(steps.unit-test.exitCode.path)) -ne 0 ]; then
            echo "true" > $(results.unstable.path)
          fi
        ComputeResources: {}
        SecurityContext:
        Storage:
        WhenVal: false
    wrrn: ""
  - langVersion: v1
    name: clone-awr-repo
    category: Utils
    params:
      - name: git-ref
        type: string
        description: The review ID or branch to check out from Gerrit
        default: dev
        ui:
          name: git-ref
    results:
      - name: repoPath
        description: Path to the repository root directory.
      - name: commit-hash
        description: Commit hash, only used when building nightly dev branch
    steps:
      - name: clone-awr-repo
        task: Utils/YGGDRASIL/git-shallow-clone@0.0.3
        params:
          depth: "1"
          repository:
            git-ref: $(params.git-ref)
            password: $(secrets.gerrit-cred.password.path)
            url: https://gitgerrit.asux.aptiv.com/Core_Radar_Gen7_SAF85xx
            username: $(secrets.gerrit-cred.username.path)
        WhenVal: false
        returnResults:
          repoPath: repoPath
          commitHash: commit-hash
    wrrn: ""
  - langVersion: v1
    name: prepare-vote-and-message
    category: Utils
    params:
      - name: unit-test-exit-codes
        type: map
        description: Exit codes for any unit test tasks
        ui:
          name: Unit Test Exit Codes
        render:
          templateName: map
      - name: upload-exit-codes
        type: map
        description: Exit codes for any upload tasks
        ui:
          name: Upload Exit Codes
        render:
          templateName: map
      - name: decision-coverages
        type: map
        description: Decision Coverage results from UT
        ui:
          name: Decision Coverage Results
        render:
          templateName: map
      - name: branch-coverages
        type: map
        description: Branch Coverage results from UT
        ui:
          name: Branch Coverage Results
        render:
          templateName: map
      - name: function-coverages
        type: map
        description: Function Coverage results from UT
        ui:
          name: Function Coverage Results
        render:
          templateName: map
      - name: line-coverages
        type: map
        description: Line Coverage results from UT
        ui:
          name: Line Coverage Results
        render:
          templateName: map
      - name: untested-files
        type: map
        description: Untested files results from UT
        ui:
          name: Untested files
        render:
          templateName: map
      - name: true-counts
        type: map
        description: True count for UT functions
        ui:
          name: true-counts
        render:
          templateName: map
      - name: false-counts
        type: map
        description: False count for UT functions
        ui:
          name: false-counts
        render:
          templateName: map
      - name: error-messages
        type: map
        description: Error messages from UT build
        ui:
          name: Error messages
        render:
          templateName: map
    results:
      - name: vote-value
        description: Value to vote back to Gerrit
      - name: vote-message
        description: Message to write back to Gerrit
      - name: exit-code
        description: Exit code to provide to any downstream tasks
    steps:
      - name: analyze-unit-test-codes
        script: |-
          # Write in "success" values
          echo -n "+1" > $(results.vote-value.path)
          echo -n "0" > $(results.exit-code.path)

          # Read and act on Unit Test exit codes
          while read line; do
            echo $line
            if [[ $line =~ ([[:alnum:]]+):[[:blank:]]([[:digit:]]+) ]]; then
              if [ ${BASH_REMATCH[2]} != 0 ]
              then
                echo -n "-1" > $(results.vote-value.path)
                echo -n "1" > $(results.exit-code.path)
                if [ ${BASH_REMATCH[2]} == 2 ]
                then
                  echo "${BASH_REMATCH[1]} Unit Tests Failed! ⚠" >> $(results.vote-message.path)
                elif [ ${BASH_REMATCH[2]} == 3 ]
                then
                  echo "${BASH_REMATCH[1]} Unit Tests Coverage Limit Exceeded! 🚧" >> $(results.vote-message.path)
                else
                  echo "${BASH_REMATCH[1]} Unit Tests Error! ❌" >> $(results.vote-message.path)
                fi

                while read line; do
                  if [[ $line =~ ^([[:alnum:]]+):[[:blank:]]*(.*) ]]; then
                    echo "~~~~~~~~~~~~~~~~~~~~~~~"
                    echo $line
                    echo "${BASH_REMATCH[1]}"
                    echo "${BASH_REMATCH[2]}"

                    if [ ${BASH_REMATCH[1]} = ${variant} ]; then
                      echo "> ${BASH_REMATCH[2]}" >> $(results.vote-message.path)
                    fi
                  fi
                done < $(params.error-messages.path)

              else
                variant="${BASH_REMATCH[1]}"

                echo "${variant} Unit Tests Successful! ✔️" >> $(results.vote-message.path)

                while read line; do
                  if [[ $line =~ ([[:alnum:]]+):[[:blank:]]([[:digit:]]+) ]]; then
                    if [ ${BASH_REMATCH[1]} = ${variant} ]; then
                      echo "> Line Coverage: ${BASH_REMATCH[2]}%" >> $(results.vote-message.path)
                    fi
                  fi
                done < $(params.line-coverages.path)

                while read line; do
                  if [[ $line =~ ([[:alnum:]]+):[[:blank:]]([[:digit:]]+) ]]; then
                    if [ ${BASH_REMATCH[1]} = ${variant} ]; then
                      echo "> Decision Coverage: ${BASH_REMATCH[2]}%" >> $(results.vote-message.path)
                    fi
                  fi
                done < $(params.decision-coverages.path)

                while read line; do
                  if [[ $line =~ ([[:alnum:]]+):[[:blank:]]([[:digit:]]+) ]]; then
                    if [ ${BASH_REMATCH[1]} = ${variant} ]; then
                      echo "> Function Coverage: ${BASH_REMATCH[2]}%" >> $(results.vote-message.path)
                    fi
                  fi
                done < $(params.function-coverages.path)

                while read line; do
                  if [[ $line =~ ([[:alnum:]]+):[[:blank:]]([[:digit:]]+) ]]; then
                    if [ ${BASH_REMATCH[1]} = ${variant} ]; then
                      echo "> Branch Coverage: ${BASH_REMATCH[2]}%" >> $(results.vote-message.path)
                    fi
                  fi
                done < $(params.branch-coverages.path)

                while read line; do
                  if [[ $line =~ ([[:alnum:]]+):[[:blank:]]([[:digit:]]+) ]]; then
                    if [ ${BASH_REMATCH[1]} = ${variant} ]; then
                      echo "> Untested Files: ${BASH_REMATCH[2]}" >> $(results.vote-message.path)
                    fi
                  fi
                done < $(params.untested-files.path)

                while read line; do
                  if [[ $line =~ ([[:alnum:]]+):[[:blank:]]([[:digit:]]+) ]]; then
                    if [ ${BASH_REMATCH[1]} = ${variant} ]; then
                      echo "> False Count UT Functions: ${BASH_REMATCH[2]}" >> $(results.vote-message.path)
                    fi
                  fi
                done < $(params.false-counts.path)

                echo "\n" >> $(results.vote-message.path)
              fi
            fi
          done < $(params.unit-test-exit-codes.path)

          # If any unit tests failed, that's the important part
          # So we don't need to worry about checking if the upload was successful
          if [ $(cat $(results.exit-code.path)) == 1 ]
          then
            exit
          fi

          # Read and act on Upload exit codes
          while read line; do
            echo $line
            if [[ $line =~ ([[:alnum:]]+):[[:blank:]]([[:digit:]]+) ]]; then
              if [ ${BASH_REMATCH[2]} != 0 ]
              then
                if [ $(cat $(results.exit-code.path)) == 0 ]
                then
                  echo "" >> $(results.vote-message.path)
                fi
                echo -n "-1" > $(results.vote-value.path)
                echo -n "1" > $(results.exit-code.path)
                echo "${BASH_REMATCH[1]} Upload Failed! ❌" >> $(results.vote-message.path)
              fi
            fi
          done < $(params.upload-exit-codes.path)
          echo "\n" >> $(results.vote-message.path)
        ComputeResources: {}
        SecurityContext:
        Storage:
        WhenVal: false
    wrrn: ""
  - langVersion: v1
    name: publish-metrics
    category: Utils
    params:
      - name: variant
        type: select
        description: Variant to Unit Test
        ui:
          name: variant
        options:
          - name: srr7p
            description: Variant is SRR7p
            value: srr7p
          - name: flr7
            description: Variant is FLR7
            value: flr7
          # - name: flr7v3
          #   description: Variant is FLR7V3
          #   value: flr7v3
      - name: git-ref
        type: string
        description: The review ID or branch to check out from Gerrit
        default:
        ui:
          name: git-ref
      - name: branch-coverage
        type: string
        description: Branch coverage results from UT
        default:
        ui:
          name: branch-coverage
      - name: function-coverage
        type: string
        description: Function coverage results from UT
        ui:
          name: function-coverage
      - name: line-coverage
        type: string
        description: Line coverage results from UT
        ui:
          name: line-coverage
      - name: decision-coverage
        type: string
        description: Decision coverage results from UT
        ui:
          name: decision-coverage
      - name: untested-files
        type: string
        description: Untested files results from UT
        ui:
          name: Untested files
      - name: project-name
        type: string
        description: Project name
        ui:
          name: project-name
      - name: commit-hash
        type: string
        description: The current commit hash, it can be the same as the git-ref.
        ui:
          name: commit-hash
      - name: ut-files-path
        type: string
        description: The jfrog path to the ut files zip file.
        ui:
          name: ut-files-path
      - name: destination-path
        type: string
        description: The path to unzip the downloaded zip file.
        ui:
          name: destination-path
      - name: tags
        type: string
        description: Any extra tags needed to pass to Platform Health for extra filtering. e.g. "env=test, build=standalone"
        ui:
          name: tags

    results:
      - name: exit-code
        description: Exit code to provide to any downstream tasks
    steps:
      - name: download-ut-files
        task: core-radar-jfrog-download
        params:
          downloadPath: $(params.ut-files-path)
          destinationPath: $(params.destination-path)
        WhenVal: false
        returnResults:
          exit-code: exit-code
      - name: publish
        image: system.registry.389177498442.awsaptiv.com/aptiv-core-radar/build-format-ready:2.0
        script: |
          #!/usr/bin/env python3

          import subprocess
          import sys
          import os
          import zipfile
          import json

          TARGET = "/tmp/python-packages"
          MARKER = os.path.join(TARGET, ".deps_installed")

          if TARGET not in sys.path:
              sys.path.insert(0, TARGET)

          def install_deps_and_restart():
              subprocess.check_call([
                  sys.executable, "-m", "pip", "install",
                  "--break-system-packages",
                  "--no-cache-dir",
                  "--target", TARGET,
                  "psycopg2-binary"
              ])

              # mark that deps are installed
              os.makedirs(TARGET, exist_ok=True)
              with open(MARKER, "w"):
                  pass

              # hard restart the interpreter
              os.execv(sys.executable, [sys.executable] + sys.argv)

          # First run: deps not installed yet
          if not os.path.exists(MARKER):
              print("Installing Python dependencies...")
              install_deps_and_restart()

          # Second run: deps already installed
          import psycopg2


          from psycopg2 import sql, extras
          from datetime import datetime
          from psycopg2.extras import Json

          def parse_extra_tags(extra_tags_str):
              """Parse a string of extra tags into a dictionary"""
              extra_tags = {}
              if extra_tags_str:
                  try:
                      extra_tags = json.loads(extra_tags_str)
                  except json.JSONDecodeError:
                      # Handle case where input is not valid JSON
                      for item in extra_tags_str.split(","):
                          key_value = item.split("=")
                          if len(key_value) == 2:
                              key, value = key_value
                              extra_tags[key.strip()] = value.strip()
              return extra_tags

          def read_file(file_path):
              """Reads a file and returns its contents."""
              with open(os.path.expandvars(file_path), 'r') as file:
                  return file.read().strip()

          def read_json_file(file_path):
              """Reads a JSON file and returns its content as a dictionary."""
              try:
                  with open(file_path, "r") as f:
                      return json.load(f)
              except Exception as e:
                  print(f"Error reading JSON file {file_path}: {e}")
                  return None

          def read_text_file(file_path):
            try:
              with open(file_path, "r", encoding="utf-8") as f:
                content = f.read()
                lines = content.splitlines()
                untested_files = []
                capture = False

                for line in lines:
                    line = line.strip()
                    if "Untested source file" in line:
                        capture = True
                        continue
                    if capture:

                        # Only consider lines that look like file paths
                        if '.' in line and '/' in line:
                            cleaned_line = line.rstrip('|').strip()
                            if cleaned_line:
                              untested_files.append(cleaned_line)

                return untested_files

            except Exception as e:
                print(f"Error reading report.txt file {file_path}:{e}")
                return None

          def construct_data_list_from_ut_true_json(ut_true_count_data, metric_tags, commit_hash, currentDateTime, branch, project_name, build_no, pipeline_name):
              """Process UT True Count JSON and prepare data for insertion into the database."""
              data_list = []

              for filename, values in ut_true_count_data.items():
                  # skip the summary keys
                  if filename in ["total_true","total_false","total_tests","total_coverage"]:
                    continue

                  true_count = values.get("True Count", 0)
                  total_count = values.get("Total", 0)

                  data_list.extend([
                      {
                          "commitid": commit_hash, "date": currentDateTime, "branch": branch, "tag": "",
                          "project": project_name, "metric_name": "core_radar.gen7v2.unittest.true_count",
                          "metric_value": true_count, "metric_tags": {**metric_tags, "category": "true_count", "filename": filename},
                          "wrsd_tags": {
                              "build_no": build_no, "pipeline_name": pipeline_name, "status": None, "duration": None,
                              "build_url": f"https://$(studio.home)/plm/view/{pipeline_name}/runs/{build_no}",
                          }
                      },
                      {
                          "commitid": commit_hash, "date": currentDateTime, "branch": branch, "tag": "",
                          "project": project_name, "metric_name": "core_radar.gen7v2.unittest.true_count",
                          "metric_value": total_count, "metric_tags": {**metric_tags, "category": "total_count", "filename": filename},
                          "wrsd_tags": {
                              "build_no": build_no, "pipeline_name": pipeline_name, "status": None, "duration": None,
                              "build_url": f"https://$(studio.home)/plm/view/{pipeline_name}/runs/{build_no}",
                          }
                      }
                  ])

              return data_list

          def insert_wrsd_tags(cursor, wrsd_tags):
              """Inserts or retrieves an existing wrsd_tags ID from perception_metrics_wrsd."""
              cursor.execute("""
                  SELECT id FROM wrsd."perception_metrics_wrsd"
                  WHERE build_no = %s AND pipeline_name = %s;
              """, (wrsd_tags['build_no'], wrsd_tags['pipeline_name']))
              result = cursor.fetchone()
              if result:
                  return result[0]
              else:
                  cursor.execute("""
                      INSERT INTO wrsd."perception_metrics_wrsd" (build_no, pipeline_name, status, duration, build_url)
                      VALUES (%s, %s, %s, %s, %s) RETURNING id;
                  """, (wrsd_tags['build_no'], wrsd_tags['pipeline_name'], wrsd_tags['status'], wrsd_tags['duration'], wrsd_tags['build_url']))
                  return cursor.fetchone()[0]

          def insert_perception_metrics(cursor, data_list):
              """Inserts multiple perception_metrics entries into the database."""
              for data in data_list:
                  wrsd_id = insert_wrsd_tags(cursor, data['wrsd_tags'])
                  cursor.execute("""
                      INSERT INTO wrsd."perception_metrics" ("CommitId", date, branch, tag, project, metric_name, metric_value, metric_tags, wrsd_id)
                      VALUES (%s, %s, %s, %s, %s, %s, %s, %s, %s);
                  """, (
                      data['commitid'], data['date'], data['branch'], data['tag'],
                      data['project'], data['metric_name'], data['metric_value'],
                      Json(data['metric_tags']), wrsd_id
                  ))

          def construct_data_list_from_json(ut_data, metric_tags, commit_hash, currentDateTime, branch, project_name, build_no, pipeline_name):
              """Constructs data_list dynamically based on UT report JSON."""

              # Define metric categories and their corresponding ut_data keys
              metrics = [
                  ("overall_branch_covered", "branch_covered"),
                  ("overall_branch_total", "branch_total"),
                  ("overall_decision_covered", "decision_covered"),
                  ("overall_decision_total", "decision_total"),
                  ("overall_function_covered", "function_covered"),
                  ("overall_function_total", "function_total"),
                  ("overall_line_covered", "line_covered"),
                  ("overall_line_total", "line_total"),
              ]

              # add overall coverage and total numbers
              data_list = [
                  {
                      "commitid": commit_hash, "date": currentDateTime, "branch": branch, "tag": "",
                      "project": project_name, "metric_name": "core_radar.gen7v2.unittest.details",
                      "metric_value": ut_data.get(metric_key, []), "metric_tags": {**metric_tags, "category": category},
                      "wrsd_tags": {"build_no": build_no,"pipeline_name": pipeline_name, "status": None, "duration": None,
                          "build_url": f"https://$(studio.home)/plm/view/{pipeline_name}/runs/{build_no}",
                      },
                  }
                  for category, metric_key in metrics
              ]

              for file_entry in ut_data.get("files", []):
                  filename = file_entry["filename"]

                  for metric, category in [
                      ("branch_covered", "branch_covered"),
                      ("branch_total", "branch_total"),
                      ("decision_covered", "decision_covered"),
                      ("decision_total", "decision_total"),
                      ("function_covered", "function_covered"),
                      ("function_total", "function_total"),
                      ("line_covered", "line_covered"),
                      ("line_total", "line_total"),
                  ]:
                      if metric in file_entry:
                          data_list.append({
                              "commitid": commit_hash, "date": currentDateTime, "branch": branch, "tag": "", "project": project_name,
                              "metric_name": "core_radar.gen7v2.unittest.details", "metric_value": file_entry[metric],
                              "metric_tags": {**metric_tags, "category": category, "filename": filename},
                              "wrsd_tags": {
                                  "build_no": build_no, "pipeline_name": pipeline_name, "status": None,
                                  "duration": None, "build_url": f"https://$(studio.home)/plm/view/{pipeline_name}/runs/{build_no}"
                              }
                          })
              return data_list

          def construct_data_list_from_untested(untested_data, metric_tags, commit_hash, currentDateTime, branch, project_name, build_no, pipeline_name):
              """Constructs data_list dynamically based on UT untested txt report."""
              data_list = []

              for filename in untested_data:

                  for metric, category in [
                      ("branch_covered", "branch_covered"),
                      ("branch_total", "branch_total"),
                      ("decision_covered", "decision_covered"),
                      ("decision_total", "decision_total"),
                      ("function_covered", "function_covered"),
                      ("function_total", "function_total"),
                      ("line_covered", "line_covered"),
                      ("line_total", "line_total"),
                  ]:
                    data_list.append({
                        "commitid": commit_hash, "date": currentDateTime, "branch": branch, "tag": "", "project": project_name,
                        "metric_name": "core_radar.gen7v2.unittest.details", "metric_value": -1,
                        "metric_tags": {**metric_tags, "category": category, "filename": filename},
                        "wrsd_tags": {
                            "build_no": build_no, "pipeline_name": pipeline_name, "status": None,
                            "duration": None, "build_url": f"https://$(studio.home)/plm/view/{pipeline_name}/runs/{build_no}"
                        }
                    })
              return data_list

          def unzip_file(destination_path, extract_base="/tmp"):
              """
              Find the first ZIP file in a workspace directory and extract it to /tmp.

              Args:
                  destination_path (str): Path to the Tekton workspace containing the ZIP
                  extract_base (str): Base directory to extract into (default: /tmp)

              Returns:
                  str: Path to the extracted directory

              Raises:
                  FileNotFoundError: If no ZIP file is found
              """
              print(f"Searching for ZIP in workspace: {destination_path}")

              for fname in os.listdir(destination_path):
                  if fname.lower().endswith(".zip"):
                      zip_path = os.path.join(destination_path, fname)

                      extract_dir = os.path.join(
                          extract_base, os.path.splitext(fname)[0]
                      )

                      print(f"Extracting {zip_path} → {extract_dir}")
                      os.makedirs(extract_dir, exist_ok=True)

                      with zipfile.ZipFile(zip_path, "r") as zip_ref:
                          zip_ref.extractall(extract_dir)

                      return extract_dir

              raise FileNotFoundError(
                  f"No ZIP file found in workspace directory: {destination_path}"
              )

          def get_file(destination_path, des_file):
            """Find and extract des_file from a given folder."""
            for root,dirs,files in os.walk(destination_path):
              if des_file in files:
                print(f"Found file: {des_file}")
                return (os.path.join(root,des_file))

            return None

          # Database connection details
          pg_user = read_file(r'$(secrets.postgresql-auth.username.path)')
          pg_pass = read_file(r'$(secrets.postgresql-auth.password.path)')

          db_config = {
              "dbname": "monitoring",
              "user": pg_user,
              "password": pg_pass,
              "host": "monitoring-wrds.c9qq8e0oklwk.eu-central-1.rds.amazonaws.com",
              "port": "5432"
          }

          # Unzip the downloaded UT folder
          unzipped_folder = unzip_file("$(params.destination-path)")

          # Load the True Count JSON file
          ut_true_count_json_file_path = get_file(unzipped_folder, "ut_true_count_report.json")
          ut_true_count_data = read_json_file(ut_true_count_json_file_path)

          # Load the GCOVR JSON file
          json_file_path = get_file(unzipped_folder, "report_gcovr_report.json")
          ut_data = read_json_file(json_file_path)

          # Load the untested files
          text_file_path = get_file(unzipped_folder, "report.txt")
          untested_file_array = read_text_file(text_file_path)

          # Extract metadata
          branch = "$(params.git-ref)"
          project_name = "$(params.project-name)"
          commit_hash = "$(params.commit-hash)"
          build_no = "$(config.pipeline.runNumber)"
          pipeline_name = "$(config.pipeline.name)"
          now = datetime.now()
          currentDateTime = now.strftime("%Y-%m-%d %H:%M:%S")
          extra_tags = parse_extra_tags("$(params.tags)")
          untested_files = $(params.untested-files)

          metric_tags = {"variant": "$(params.variant)"}
          metric_tags.update(extra_tags)

          coverage_metrics = [
              ("BranchCoverage", "$(params.branch-coverage)"),
              ("DecisionCoverage", "$(params.decision-coverage)"),
              ("LineCoverage", "$(params.line-coverage)"),
              ("FunctionCoverage", "$(params.function-coverage)"),
          ]

          # Load the coverage results form the UT job
          data_list = [
              {
                  "commitid": commit_hash,"date": currentDateTime, "branch": branch, "tag": "",
                  "project": project_name, "metric_name": "core_radar.gen7v2.unittest",
                  "metric_value": value, "metric_tags": {**metric_tags, "category": category},
                  "wrsd_tags": { "build_no": build_no, "pipeline_name": pipeline_name,"status": None,"duration": None,
                      "build_url": f"https://$(studio.home)/plm/view/{pipeline_name}/runs/{build_no}",
                  },
              }
              for category, value in coverage_metrics
          ]

          # add untested
          data_list.extend([
              {
                  "commitid": commit_hash, "date": currentDateTime, "branch": branch, "tag": "",
                  "project": project_name, "metric_name": "core_radar.gen7v2.unittest",
                  "metric_value": untested_files, "metric_tags": {"variant":"$(params.variant)","category":"UntestedFiles"},
                  "wrsd_tags": {
                      "build_no": build_no, "pipeline_name": pipeline_name, "status": None, "duration": None,
                      "build_url": f"https://$(studio.home)/plm/view/{pipeline_name}/runs/{build_no}",
                  }
              }
          ])

          # Now add the additional JSON data
          if ut_data:
              print("Adding UT results to data_list...")
              data_list.extend(construct_data_list_from_json(ut_data, metric_tags, commit_hash, currentDateTime, branch, project_name, build_no, pipeline_name))

          if untested_file_array:
              print("Adding untested files to data_list...")
              data_list.extend(construct_data_list_from_untested(untested_file_array,metric_tags, commit_hash, currentDateTime, branch, project_name, build_no, pipeline_name))

          if ut_true_count_data:
              print("Adding true count results to data_list...")
              data_list.extend(construct_data_list_from_ut_true_json(ut_true_count_data, metric_tags, commit_hash, currentDateTime, branch, project_name, build_no, pipeline_name))

          print(f"Prepared {len(data_list)} records for database insertion.")

          for data in data_list:
            print(data)

          # Insert into the database
          if branch == "dev":
              try:
                  connection = psycopg2.connect(**db_config)
                  cursor = connection.cursor()

                  insert_perception_metrics(cursor, data_list)
                  connection.commit()
                  print("Data inserted successfully.")

              except Exception as e:
                  print(f"An error occurred: {e}")

              finally:
                  if connection:
                      cursor.close()
                      connection.close()
          else:
              print("Not Dev branch so nothing will be committed to Platform Health.")

        onError: continue
        ComputeResources: {}
        SecurityContext:
        Storage:
        WhenVal: false
    wrrn: ""

