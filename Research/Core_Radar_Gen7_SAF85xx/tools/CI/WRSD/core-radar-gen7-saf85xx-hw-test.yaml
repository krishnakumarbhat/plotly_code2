langVersion: v1
name: core-radar-gen7-saf85xx-hw-test
description: Pipeline that flashes the software and runs a smoke test on all variants of the code for Gen7v2 SAF85xx
ui:
  name: core-radar-gen7-saf85xx-hw-test
params:
  - name: change-id
    type: string
    default: ""
  - name: commit-id
    type: string
    default: dev
  - name: gerrit-url
    type: string
    default: https://gitgerrit.asux.aptiv.com
  - name: project-url-encoded
    type: string
    default: Core_Radar_Gen7_SAF85xx
  - name: upload-path
    type: string
    description: |-
      The path inside of JFrog to upload the outputs to. Note - this does not include the base URL of the JFrog Artifactory
      Ex. core_radar-aptiv-00000000-gen7_saf85xx-local/reviews/45/12345/6/unitTests/
    default: "core_radar-aptiv-00000000-gen7_saf85xx-local/wrsd/saf85xx/manual/0/hwTests/"
    ui:
      name: JFrog Upload Path
  - name: download-path
    type: string
    description: |-
      The path inside of JFrog to download the outputs from. Note - this does not include the base URL of the JFrog Artifactory
      Ex. core_radar-aptiv-00000000-gen7_saf85xx-local/wrsd/saf85xx/verification/1381/buildFiles/
    default: "core_radar-aptiv-00000000-gen7_saf85xx-local/wrsd/saf85xx/manual/0/buildFiles/"
    ui:
      name: JFrog Download Path
  - name: gateway
    type: string
    default: perceptionGateway
  - name: branch-name
    type: string
    default: dev
  - name: change-url
    type: string
    default: ""
  - name: patchset-id
    type: string
    default: ""
  - name: testTimeout
    type: string
    default: "10m"
    description: |-
      Timeout of the smoke test stage in case there is an issue. Needs "m" or "h" at the end.
      Default is 10m, nightly is 20m, and weekly should be 12h
  - name: testDuration
    type: string
    default: "60"
    description: |-
      Duration of the smoke test in seconds. Default is 60 seconds, nightly is 600 (10min), and weekly is 36000 (10hrs)
  - name: overallTimeout
    type: string
    default: "90m"
    description: |-
      Timeout of overall smoke test, this should at least be double the testTime + reserve timeout.
  - name: powerCycles
    type: string
    default: "0"
    description: |-
      Number of power cycles to run in the power cycle test.
compute:
  - name: linux-16c64g
    resource: asp-compute-linux-16c64g
  - name: linux-8c32g
    resource: asp-compute-linux-8c32g
  - name: linux-2c8g
    resource: asp-compute-linux-2c8g
  - name: linux-1c4g
    resource: asp-compute-linux-1c4g
  - resource: asp-compute-linux-1c4g # This becomes the default compute.
containerSettings:
  - name: container-16c64g300g
    resource: asp-container-16c64g300g
  - name: container-8c32g150g
    resource: asp-container-8c32g150g
  - name: container-2c8g50g
    resource: asp-container-2c8g50g
  - name: container-1c4g25g
    resource: asp-container-1c4g25g
tasks:
  - name: publish-run
    task: Utils/core-radar-publish-run@0.1.1
    timeout: 5m
  - name: pre-gerrit-comment-vote
    task: Utils/ADVRADAR/post-gerrit-comment-vote@1.0.0
    params:
      gerrit-setup: {}
      message: |
        🔔 WRSD Smoke Test job has been added to the queue.

        https://$(studio.home)/plm/view/$(config.pipeline.name)/runs/$(config.pipeline.runNumber)
      votes:
        Smoke-Test: "0"
  - name: reserve-bench
    task: Utils/core-radar-reserve-bench@0.0.1
    params:
      gateway: $(params.gateway)
      group-name: "core_radar_gen7v2_cicd"
    timeout: 55m

  - name: smoke-test-flr7
    task: test/smoke-test
    onError: continue
    params:
      variant: flr7
      project-name: $(params.project-url-encoded)
      commit-id: $(params.commit-id)
      upload-path: $(params.upload-path)
      download-path: $(params.download-path)
      gateway: $(params.gateway)
      bench-name: $(tasks.reserve-bench.results.bench-name)
      bench-user: $(tasks.reserve-bench.results.bench-user)
      bench-ip: $(tasks.reserve-bench.results.bench-ip)
      repo-url: "$(params.gerrit-url)/a/$(params.project-url-encoded)"
      testDuration: $(params.testDuration)
      powerCycles: $(params.powerCycles)
    timeout: $(params.testTimeout)

  - name: smoke-test-srr7p
    task: test/smoke-test
    onError: continue
    params:
      variant: srr7p
      project-name: $(params.project-url-encoded)
      commit-id: $(params.commit-id)
      upload-path: $(params.upload-path)
      download-path: $(params.download-path)
      gateway: $(params.gateway)
      bench-name: $(tasks.reserve-bench.results.bench-name)
      bench-user: $(tasks.reserve-bench.results.bench-user)
      bench-ip: $(tasks.reserve-bench.results.bench-ip)
      repo-url: "$(params.gerrit-url)/a/$(params.project-url-encoded)"
      testDuration: $(params.testDuration)
      powerCycles: $(params.powerCycles)
    timeout: $(params.testTimeout)

  - name: prepare-vote-and-message
    task: Utils/prepare-vote-and-message
    params:
      download-exit-codes:
        FLR7: $(tasks.smoke-test-flr7.results.download-exit-code)
        SRR7p: $(tasks.smoke-test-srr7p.results.download-exit-code)
      upload-exit-codes:
        FLR7: $(tasks.smoke-test-flr7.results.upload-exit-code)
        SRR7p: $(tasks.smoke-test-srr7p.results.upload-exit-code)
      flash-exit-codes:
        FLR7: $(tasks.smoke-test-flr7.results.flash-exit-code)
        SRR7p: $(tasks.smoke-test-srr7p.results.flash-exit-code)
      smoke-test-exit-codes:
        FLR7: $(tasks.smoke-test-flr7.results.smoke-test-exit-code)
        SRR7p: $(tasks.smoke-test-srr7p.results.smoke-test-exit-code)
      error-messages:
        FLR7: $(tasks.smoke-test-flr7.results.error-message)
        SRR7p: $(tasks.smoke-test-srr7p.results.error-message)
    timeout: 5m

  - name: hw-test-vote
    task: Utils/ADVRADAR/post-gerrit-comment-vote@1.0.0
    params:
      gerrit-setup: {}
      message: |-
        $(tasks.prepare-vote-and-message.results.vote-message)

        Build Outputs: https://jfrog.asux.aptiv.com/ui/repos/tree/General/$(params.upload-path)

        Build Job: https://$(studio.home)/plm/view/$(config.pipeline.name)/runs/$(config.pipeline.runNumber)
      votes:
        Smoke-Test: $(tasks.prepare-vote-and-message.results.vote-value)
    timeout: 5m

  - parallelTasks:
      - name: publish-metrics-srr7p
        task: Utils/publish-metrics
        when:
          - input: $(params.commit-id)
            operator: in
            values:
              - dev
        params:
          git-ref: $(params.commit-id)
          project-name: $(params.project-url-encoded)
          variant: srr7p
          report-files-path: $(tasks.smoke-test-srr7p.results.jf-upload-path)
          destination-path: /workspace/Core_Radar_Gen7_SAF85xx/
          commit-hash: $(tasks.smoke-test-srr7p.results.commit-hash)
        timeout: 5m

      - name: publish-metrics-flr7
        task: Utils/publish-metrics
        when:
          - input: $(params.commit-id)
            operator: in
            values:
              - dev
        params:
          git-ref: $(params.commit-id)
          project-name: $(params.project-url-encoded)
          variant: flr7
          report-files-path: $(tasks.smoke-test-flr7.results.jf-upload-path)
          destination-path: /workspace/Core_Radar_Gen7_SAF85xx/
          commit-hash: $(tasks.smoke-test-flr7.results.commit-hash)
        timeout: 5m

      - name: auto-submit-check
        task: Utils/ADVRADAR/auto-submit@1.0.1
        params:
          project-name: $(params.project-url-encoded)
          change-id: $(params.change-id)
          gerrit-url: $(params.gerrit-url)
          comment: "False"

final:
  - name: unreserve-bench
    task: Utils/core-radar-unreserve-bench@0.0.1
    params:
      bench-name: $(tasks.reserve-bench.results.bench-name)
      target-id: $(tasks.reserve-bench.results.target-id)
    timeout: 1m
    when:
      - input: $(tasks.status)
        operator: in
        values:
          - Completed
          - Succeeded
          - Failed

defineTasks:
  - name: smoke-test
    langVersion: v1
    category: test
    params:
      - name: commit-id
        type: string
        default: "1234567890"
      - name: project-name
        type: string
        default: $(params.project-name)
      - name: repo-url
        type: string
        description: Project git repo url
        ui:
          name: repo-url
      - name: variant
        type: select
        description: Variant to Unit Test
        ui:
          name: variant
        options:
          - name: srr7p
            description: Variant is SRR7p
            value: srr7p
          - name: flr7
            description: Variant is FLR7
            value: flr7
        default: srr7p
      - name: upload-path
        type: string
        description: |-
          The path inside of JFrog to upload the outputs to. Note - this does not include the base URL of the JFrog Artifactory
          Ex. core_radar-aptiv-00000000-gen7_saf85xx-local/reviews/45/12345/6/unitTests/
        default: "core_radar-aptiv-00000000-gen7_saf85xx-local/wrsd/saf85xx/verification/1381/hwTests/"
        ui:
          name: JFrog Upload Path
      - name: download-path
        type: string
        description: |-
          The path inside of JFrog to download the outputs from. Note - this does not include the base URL of the JFrog Artifactory
          Ex. core_radar-aptiv-00000000-gen7_saf85xx-local/wrsd/saf85xx/verification/1381/buildFiles/
        default: "core_radar-aptiv-00000000-gen7_saf85xx-local/wrsd/saf85xx/verification/1381/buildFiles/"
        ui:
          name: JFrog Download Path
      - name: gateway
        type: string
        default: perceptionGateway
      - name: bench-name
        type: string
        default: ""
      - name: bench-user
        type: string
        description: The user of the reserved test bench
      - name: bench-ip
        type: string
        description: The ip of the reserved test bench
      - name: testDuration
        type: string
        description: The test duration in seconds
      - name: powerCycles
        type: string
        description: The number of power cycles to perform
        default: "0"
    results:
      - name: jf-upload-url
        description: The URL the outputs are uploaded to.
      - name: jf-upload-path
        description: The path the outputs are uploaded to.
      - name: download-exit-code
        description: The exit code of the download step
      - name: flash-exit-code
        description: The exit code of the flash step
      - name: smoke-test-exit-code
        description: The exit code of the smoke test step
      - name: power-cycle-test-exit-code
        description: The exit code of the power cycle test step
      - name: upload-exit-code
        description: The exit code of the upload step
      - name: error-message
        description: A string with any new errors found
      - name: commit-hash
        description: commit-hash to provide to any downstream tasks
      - name: commit-hash-exit-code
        description: The exit code of the flash step
    steps:
      - name: check-git-ref
        image: system.registry.389177498442.awsaptiv.com/aptiv-core-radar/build-format-ready:2.0
        params:
          repo-url: $(params.repo-url)
        script: |
          #!/bin/bash

          # set default return values
          echo -n "" > $(results.commit-hash.path)
          echo -n "" > $(results.commit-hash-exit-code.path)

          # Check input values
          if [ "$(params.bench-name)" == "" ]; then
            echo "No bench name, skipping stage"
            exit -1
          fi
          if [ "$(params.bench-user)" == "" ]; then
            echo "No bench user, skipping stage"
            exit -1
          fi
          if [ "$(params.bench-ip)" == "" ]; then
            echo "No bench IP, skipping stage"
            exit -1
          fi

          # Input parameters
          git_ref=$(params.commit-id)
          repo_url=$(params.repo-url)
          cp $(secrets.netrc.path) ~/.netrc

          # Function to resolve branch name or commit hash
          resolve_to_commit_hash() {
              local ref=$1
              local repo=$2
              if [ "$ref" == "dev" ]; then
                  # Get the latest commit hash for 'dev' branch using git ls-remote
                  latest_commit=$(git ls-remote "$repo" refs/heads/dev | awk '{print $1}')
                  if [ -z "$latest_commit" ]; then
                      echo "Error: Unable to retrieve the latest commit for 'dev' branch." >&2
                      echo -n "1" > $(results.commit-hash-exit-code.path)
                      exit 1
                  fi
                  echo "$latest_commit"
              else
                  # If it's not 'dev', assume it's a commit hash and validate it
                  if [[ "$ref" =~ ^[a-f0-9]{40}$ ]]; then
                      echo "$ref"
                  else
                      echo "Error: Invalid commit hash or unsupported ref format: $ref" >&2
                      echo -n "1" > $(results.commit-hash-exit-code.path)
                      exit 1
                  fi
              fi
          }

          # Main logic
          if [ -z "$git_ref" ] || [ -z "$repo_url" ]; then
              echo "Usage: $0 <git-ref> <repository-url>" >&2
              echo -n "1" > $(results.commit-hash-exit-code.path)
              exit 1
          fi

          # Resolve the commit hash
          commit_hash=$(resolve_to_commit_hash "$git_ref" "$repo_url")

          echo -n "$commit_hash" >> $(results.commit-hash.path)
          echo "Resolved Commit Hash: $commit_hash"

      - name: set-up-workspace
        task: Utils/core-radar-studio-cli@1.0.0
        WhenVal: false
        params:
          script: |-
            #!/bin/bash
            set +e # Disable immediate exit on error
            set +x # Disable command tracing globally

            # Define the config file path
            config_file="./config.json"

            if [ -f "$config_file" ]; then
                echo "$config_file exists"
            else
                # Provision the gateway config file
                studio-cli vlab physical slc gateway provision --gwid "$(params.gateway)" -f "$config_file"
            fi

            # Setup parameters for python script call on test bench
            action_script="target_scripts/run_cmd_on_target.sh"
            parameters='["$(params.bench-user)","$(params.bench-ip)","cd wrsd_ci_scripts/WRSD/ & cmd /c","bench_clone.bat","hw-test/v1.0.29"]'

            echo "Target Action Script Parameters: $parameters"

            studio-cli vlab physical slc target act \
              --gwid=$(params.gateway) \
              --target-name=$(params.bench-name) \
              --action-path="$action_script" \
              --config-file="$config_file" \
              --parameters="$parameters" \
              | tee target_action_output.log

            echo "------------------------------ TAS OUTPUT"
            cat target_action_output.log
            echo "------------------------------"

            target_action_output=$(cat target_action_output.log)

            error_strings=("Error:" "\[Errno")

            for error in "${error_strings[@]}"; do
              if echo "$target_action_output" | grep -q "$error"; then

                error_message=$(echo "$target_action_output" | grep -i "$error")
                echo "------------------------------"
                echo "ERROR: $error_message"
                echo "------------------------------"

                echo "Set Up Workspace Stage: $error_message" >> $(results.error-message.path)

                exit 2
              fi
            done

      - name: clean-workspace
        task: Utils/core-radar-studio-cli@1.0.0
        WhenVal: false
        params:
          script: |-
            #!/bin/bash
            set +e # Disable immediate exit on error
            set +x # Disable command tracing globally

            # Define the config file path
            config_file="./config.json"

            if [ -f "$config_file" ]; then
                echo "$config_file exists"
            else
                # Provision the gateway config file
                studio-cli vlab physical slc gateway provision --gwid "$(params.gateway)" -f "$config_file"
            fi

            # Setup parameters for python script call on test bench
            action_script="target_scripts/run_cmd_on_target.sh"
            parameters='["$(params.bench-user)","$(params.bench-ip)","cd wrsd_ci_scripts/WRSD/smoke_test_scripts/ & cmd /c","killPythonProcesses.bat",""]'

            echo "Target Action Script Parameters: $parameters"

            studio-cli vlab physical slc target act \
              --gwid=$(params.gateway) \
              --target-name=$(params.bench-name) \
              --action-path="$action_script" \
              --config-file="$config_file" \
              --parameters="$parameters" \
              | tee target_action_output.log

            echo "------------------------------ TAS OUTPUT"
            cat target_action_output.log
            echo "------------------------------"

            target_action_output=$(cat target_action_output.log)

            error_strings=("Error:" "\[Errno")

            for error in "${error_strings[@]}"; do
              if echo "$target_action_output" | grep -q "$error"; then

                error_message=$(echo "$target_action_output" | grep -i "$error")
                echo "------------------------------"
                echo "ERROR: $error_message"
                echo "------------------------------"

                echo "Clean Stage: $error_message" >> $(results.error-message.path)

                exit 2
              fi
            done

      - name: download-build-files
        task: Utils/core-radar-studio-cli@1.0.0
        WhenVal: false
        params:
          script: |-
            #!/bin/bash
            set +e # Disable immediate exit on error
            set +x # Disable command tracing globally

            echo -n "" > $(results.download-exit-code.path)

            # Define the config file path
            config_file="./config.json"

            if [ -f "$config_file" ]; then
                echo "$config_file exists"
            else
                # Provision the gateway config file
                studio-cli vlab physical slc gateway provision --gwid "$(params.gateway)" -f "$config_file"
            fi

            # Setup parameters for python script call on test bench
            action_script="target_scripts/run_cmd_on_target.sh"

            parameters='["$(params.bench-user)","$(params.bench-ip)","cd wrsd_ci_scripts/WRSD/jfrog/ & python","downloadfromJfrog.py","$(params.download-path)output_$(params.variant).zip C:/Users/SID_ADVRADAR_CICD/wrsd_jfrog/"]'

            echo "Target Action Script Parameters: $parameters"

            studio-cli vlab physical slc target act \
              --gwid=$(params.gateway) \
              --target-name=$(params.bench-name) \
              --action-path="$action_script" \
              --config-file="$config_file" \
              --parameters="$parameters" \
              | tee target_action_output.log

            target_action_output=$(cat target_action_output.log)

            error_strings=("Error: Gateway disconnected" "Error: Gateway Not Registered" "Error: Failed to connect with the gateway" "server http error 50" "\[Errno")

            for error in "${error_strings[@]}"; do
              if echo "$target_action_output" | grep -q "$error"; then

                error_message=$(echo "$target_action_output" | grep -i "$error")
                echo "------------------------------"
                echo "ERROR: $error_message"
                echo "------------------------------"

                echo "Download Stage: $error_message" >> $(results.error-message.path)
                echo -n "1" > $(results.download-exit-code.path)
                exit 2
              fi
            done

            echo -n "" >> $(results.error-message.path)
            echo -n "0" > $(results.download-exit-code.path)

      - name: flash-build
        task: Utils/core-radar-studio-cli@1.0.0
        WhenVal: false
        params:
          script: |-
            #!/bin/bash
            set +e # Disable immediate exit on error
            set +x # Disable command tracing globally

            echo -n "" > $(results.flash-exit-code.path)

            if [ $(cat $(results.download-exit-code.path)) == 1 ]; then
              echo "------------------------------"
              echo "Download Stage Failed, skipping the flashing stage"
              echo "------------------------------"
              echo -n "1" > $(results.flash-exit-code.path)
            else

              # Define the config file path
              config_file="./config.json"

              if [ -f "$config_file" ]; then
                  echo "$config_file exists"
              else
                  # Provision the gateway config file
                  studio-cli vlab physical slc gateway provision --gwid "$(params.gateway)" -f "$config_file"
              fi

              # Setup parameters for python script call on test bench
              action_script="target_scripts/run_cmd_on_target.sh"

              parameters='["$(params.bench-user)","$(params.bench-ip)","cd wrsd_jfrog/quickflash~/ & python","QuickFlash.py"," -c sensor_config.xml -p COM4 -v $(params.variant)"]'

              echo "Target Action Script Parameters: $parameters"

              attempt=1
              max_attempts=2
              success=false

              while [ $attempt -le $max_attempts ]; do
                echo "Attempt $attempt of $max_attempts..."
                studio-cli vlab physical slc target act \
                  --gwid=$(params.gateway) \
                  --target-name=$(params.bench-name) \
                  --action-path="$action_script" \
                  --config-file="$config_file" \
                  --parameters="$parameters" \
                  | tee target_action_output.log || true

                target_action_output=$(cat target_action_output.log)

                if echo "$target_action_output" | grep -q 'Successfully flashed variant:'; then
                  echo "------------------------------"
                  echo "Flashing Complete"
                  echo "------------------------------"
                  success=true
                  break
                fi

                if echo "$target_action_output" | grep -q "Error: Gateway disconnected"; then
                  echo "Detected 'Gateway Disconnected' error. Retrying..."
                  ((attempt++))
                else
                  break
                fi
              done

              if [ "$success" = false ]; then
                error_found=false
                error_type=""
                error_message=""

                # Check for power supply connection errors first (critical hardware issue)
                if echo "$target_action_output" | grep -q "ERROR: Unable to connect to port.*for the power supply"; then
                  error_found=true
                  error_type="Power Supply Connection Error"
                  error_message=$(echo "$target_action_output" | grep -o "ERROR: Unable to connect to port[^.]*\.")
                  echo "true" > $(results.unstable.path)
                # Check for timeout errors first (critical flashing failure)
                elif echo "$target_action_output" | grep -q "Timeout while waiting for response"; then
                  error_found=true
                  error_type="Flash Timeout Error"
                  error_message=$(echo "$target_action_output" | grep -E "Error: Timeout.*|Failed to flash variant.*" | head -2 | tr '\n' ' ')
                  echo "true" > $(results.unstable.path)
                # Check for Python AttributeError (usually indicates a code/hardware issue)
                elif echo "$target_action_output" | grep -q "AttributeError:"; then
                  error_found=true
                  error_type="Python AttributeError Detected"
                  error_message=$(echo "$target_action_output" | grep -o "AttributeError:[^I]*" | head -1)
                  echo "true" > $(results.unstable.path)
                # No specific errors found, check for other known errors (fallback)
                else
                  error_strings=("Error: Gateway disconnected" "Error: Gateway Not Registered" "Failed to flash variant" "\[Errno" "Error:")

                  for error in "${error_strings[@]}"; do
                    if echo "$target_action_output" | grep -q "$error"; then
                      error_found=true
                      error_type="ERROR"
                      # Extract just the relevant error portion
                      error_message=$(echo "$target_action_output" | grep -o "$error[^I]*" | head -1 | sed 's/INFO.*$//' | sed 's/[[:space:]]*$//')
                      break
                    fi
                  done
                fi

                # If any error was found, handle it once
                if [ "$error_found" = true ]; then
                  echo "------------------------------"
                  echo "$error_type:"
                  echo "$error_message"
                  echo "------------------------------"

                  echo "Flashing Stage: $error_message" >> $(results.error-message.path)
                  echo -n "1" > $(results.flash-exit-code.path)
                  echo -n "true" > $(results.unstable.path)
                  # Set sane defaults for future steps:
                  echo -n "" > $(results.smoke-test-exit-code.path)
                  echo -n "" > $(results.upload-exit-code.path)
                  echo -n "" > $(results.jf-upload-url.path)
                  echo -n "" > $(results.jf-upload-path.path)
                  exit 3
                fi
              fi

              if echo "$target_action_output" | grep -q 'Successfully flashed variant:'; then
                echo "------------------------------"
                echo "Flashing Complete"
                echo "------------------------------"
              fi
            fi

            echo -n "0" > $(results.flash-exit-code.path)

      - name: smoke-test
        task: Utils/core-radar-studio-cli@1.0.0
        WhenVal: false
        params:
          # yamllint disable
          script: |-
            #!/bin/bash
            set +e # Disable immediate exit on error
            set +x # Disable command tracing globally

            echo -n "" > $(results.smoke-test-exit-code.path)

            if [ $(cat $(results.download-exit-code.path)) == 1 ]; then
              echo "------------------------------"
              echo "Download Stage Failed, skipping the flashing stage"
              echo "------------------------------"
            elif [ $(cat $(results.flash-exit-code.path)) == 1 ]; then
              echo "------------------------------"
              echo "Flash Stage Failed, skipping the smoke test stage"
              echo "------------------------------"
            else

              # Define the config file path
              config_file="./config.json"

              if [ -f "$config_file" ]; then
                  echo "$config_file exists"
              else
                  # Provision the gateway config file
                  studio-cli vlab physical slc gateway provision --gwid "$(params.gateway)" -f "$config_file"
              fi

              echo "Running smoke test for $(params.testDuration) seconds"

              # Setup parameters for python script call on test bench
              action_script="target_scripts/run_cmd_on_target.sh"

              # Call the Gen7_IntegrationTest.py script with the appropriate parameters.
              parameters='["$(params.bench-user)","$(params.bench-ip)","cd wrsd_ci_scripts/WRSD/smoke_test_scripts/python/ & python","Gen7_IntegrationTest.py","-o Gen7v2_$(params.variant)_Integration_Test -v $(params.variant) -t $(params.testDuration) -c $(params.commit-id) -b $(params.commit-id) --someip True -m true -k COM4 -e \"Ethernet 5\" -w wrsd_jfrog/$(params.variant)/streamdefs/wiresharkDissector.lua -a wrsd_jfrog/$(params.variant)/m7App.elf"]'

              echo "Target Action Script Parameters: $parameters"

              studio-cli vlab physical slc target act \
                --gwid=$(params.gateway) \
                --target-name=$(params.bench-name) \
                --action-path="$action_script" \
                --config-file="$config_file" \
                --parameters="$parameters" \
                | tee target_action_output.log

              target_action_output=$(cat target_action_output.log)

              if echo "$target_action_output" | grep "Overall Test Status: FAIL"; then
                  echo "------------------------------"
                  echo "Smoke test completed but failed a testcase"
                  echo "------------------------------"
                  echo "Completed smoke test but failed testcase(s). See report in jfrog" >> $(results.error-message.path)
                  echo -n "2" > $(results.smoke-test-exit-code.path)
                  echo -n "true" > $(results.unstable.path)
                  exit 3
              fi

              error_strings=("\[Errno" "ERROR: No BRR" "Error:" "ERROR:")
              for error in "${error_strings[@]}"; do
                if echo "$target_action_output" | grep -q "$error"; then
                  error_message=$(echo "$target_action_output" | grep -i "$error")
                  echo "------------------------------"
                  echo "ERROR: $error_message"
                  echo "------------------------------"

                  echo "Testing Stage: $error_message" >> $(results.error-message.path)
                  echo -n "1" > $(results.smoke-test-exit-code.path)
                  exit 4
                fi
              done
            fi
            echo -n "0" > $(results.smoke-test-exit-code.path)
          # yamllint enable

