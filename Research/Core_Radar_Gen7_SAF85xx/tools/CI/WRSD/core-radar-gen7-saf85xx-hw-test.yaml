          # yamllint enable

  - name: prepare-vote-and-message
    langVersion: v1
    category: Utils
    params:
      - name: download-exit-codes
        type: map
        description: Exit codes for any download tasks
        ui:
          name: Download Exit Codes
        render:
          templateName: map
      - name: upload-exit-codes
        type: map
        description: Exit codes for any upload tasks
        ui:
          name: Upload Exit Codes
        render:
          templateName: map
      - name: flash-exit-codes
        type: map
        description: Exit codes for any flash tasks
        ui:
          name: Flash Exit Codes
        render:
          templateName: map
      - name: smoke-test-exit-codes
        type: map
        description: Exit codes for any smoke test tasks
        ui:
          name: Smoke Test Exit Codes
        render:
          templateName: map
      - name: error-messages
        type: map
        description: Error messages for any smoke test tasks
        ui:
          name: Smoke Test Error messages
        render:
          templateName: map
    results:
      - name: vote-value
        description: Value to vote back to Gerrit
      - name: vote-message
        description: Message to write back to Gerrit
      - name: exit-code
        description: Exit code to provide to any downstream tasks
    steps:
      - name: analyze-build-codes
        task: Utils/core-radar-studio-cli@1.0.0
        params:
          script: |-
            # Write in default "success" values
            echo -n "+1" > $(results.vote-value.path)
            echo -n "" > $(results.vote-message.path)
            echo -n "0" > $(results.exit-code.path)

            ERROR_MESSAGES_PATH="$(params.error-messages.path)"
            VOTE_MESSAGE_PATH="$(results.vote-message.path)"
            VOTE_VALUE_PATH="$(results.vote-value.path)"
            EXIT_CODE_PATH="$(results.exit-code.path)"

            # Function to fetch and clean all error messages for a given key
            get_error_message() {
              local key="$1"
              awk -v key="$key" '
                /^'"$key"':/ {flag=1; next}
                /^[A-Za-z0-9_]+:/ {flag=0}
                flag && NF {print}
              ' "$ERROR_MESSAGES_PATH" | sed -e "s/cid='[^']\+', //" -e "s/merge_key='[^']\+', //"
            }

            #------------------------------------------------------------------------
            # Read and act on download exit codes
            while read line; do
              echo $line
              if [[ $line =~ ([[:alnum:]]+):[[:blank:]]([[:alnum:]]+[[:space:]]Stage):[[:blank:]](.+) ]]; then
                echo "${BASH_REMATCH[2]} : ${BASH_REMATCH[3]}" >> $(results.vote-message.path)
              fi
            done < $(params.error-messages.path)
            #------------------------------------------------------------------------
            # Read and act on download exit codes
            while read line; do
              echo $line
              if [[ $line =~ ([[:alnum:]]+):[[:blank:]]([[:digit:]]+) ]]; then
                if [ ${BASH_REMATCH[2]} != 0 ]
                then
                  echo -n "-1" > $(results.vote-value.path)
                  echo -n "1" > $(results.exit-code.path)
                  echo "${BASH_REMATCH[1]} Download Failed! ❌" >> $(results.vote-message.path)
                else
                  echo "${BASH_REMATCH[1]} Download Successful! ✔️" >> $(results.vote-message.path)
                fi
              fi
            done < $(params.download-exit-codes.path)

            # If any Download failed, that's the important part
            # So we don't need to worry about checking if the flashing was successful
            if [ $(cat $(results.exit-code.path)) == 1 ]
            then
              exit
            fi
            #------------------------------------------------------------------------
            # Read and act on Flash exit codes
            while read line; do
              echo $line
              if [[ $line =~ ([[:alnum:]]+):[[:blank:]]([[:digit:]]+) ]]; then
                if [ ${BASH_REMATCH[2]} != 0 ]
                then
                  echo -n "-1" > $(results.vote-value.path)
                  echo -n "1" > $(results.exit-code.path)
                  echo "${BASH_REMATCH[1]} Flash Failed! ❌" >> $(results.vote-message.path)
                else
                  echo "${BASH_REMATCH[1]} Flash Successful! ✔️" >> $(results.vote-message.path)
                fi
              fi
            done < $(params.flash-exit-codes.path)

            # If any Flash failed, that's the important part
            # So we don't need to worry about checking if the smoke test was successful
            if [ $(cat $(results.exit-code.path)) == 1 ]
            then
              exit
            fi
            #------------------------------------------------------------------------
            # Read and act on smoke test exit codes
            while read line; do
              echo $line
              if [[ $line =~ ([[:alnum:]]+):[[:blank:]]([[:digit:]]+) ]]; then
                variant=${BASH_REMATCH[1]}    # e.g., FLR7
                exit_code=${BASH_REMATCH[2]}  # e.g., 0, 1, 2

                if [ "$exit_code" == "0" ]; then
                  # Job passed
                  echo "${variant} Smoke Test Job was Successful! ✔️" >> $(results.vote-message.path)
                elif [ "$exit_code" == "1" ]; then
                  # Job failed
                  echo -n "-1" > "$VOTE_VALUE_PATH"
                  echo -n "1" > "$EXIT_CODE_PATH"
                  echo "${variant} Smoke Test Job Failed! ❌" >> "$VOTE_MESSAGE_PATH"
                elif [ "$exit_code" == "2" ]; then

                  # New issues detected
                  echo -n "-1" > "$VOTE_VALUE_PATH"
                  echo -n "2" > "$EXIT_CODE_PATH"

                  echo "${variant} Smoke Test Completed with Failures! 🚧" >> "$VOTE_MESSAGE_PATH"

                fi
              fi
            done < $(params.smoke-test-exit-codes.path)

        ComputeResources: {}
        SecurityContext:
        Storage:
        WhenVal: false
    wrrn: ""

  - name: publish-metrics
    langVersion: v1
    category: Utils
    params:
      - name: variant
        type: select
        description: Variant to Unit Test
        ui:
          name: variant
        options:
          - name: srr7p
            description: Variant is SRR7p
            value: srr7p
          - name: flr7
            description: Variant is FLR7
            value: flr7
      - name: git-ref
        type: string
        description: The review ID or branch to check out from Gerrit
        default: ""
        ui:
          name: git-ref
      - name: project-name
        type: string
        description: Project name
        ui:
          name: project-name
      - name: report-files-path
        type: string
        description: The jfrog path to the builds files zip file.
        ui:
          name: report-files-path
      - name: destination-path
        type: string
        description: The path to unzip the downloaded zip file.
        ui:
          name: destination-path
      - name: commit-hash
        type: string
        description: commit-hash to provide to any downstream tasks
        ui:
          name: commit-hash

    results:
      - name: exit-code
        description: Exit code to provide to any downstream tasks
    steps:
      - name: download-report-files
        task: core-radar-jfrog-download
        params:
          downloadPath: $(params.report-files-path)
          destinationPath: $(params.destination-path)
        WhenVal: false
        returnResults:
          exit-code: exit-code

      - name: publish
        image: system.registry.389177498442.awsaptiv.com/aptiv-core-radar/build-format-ready:2.0
        script: |
          #!/usr/bin/env python3

          import subprocess
          import sys
          import os
          import zipfile
          import re
          import json

          TARGET = "/tmp/python-packages"
          MARKER = os.path.join(TARGET, ".deps_installed")

          if TARGET not in sys.path:
            sys.path.insert(0, TARGET)

          def install_deps_and_restart():
            subprocess.check_call([
              sys.executable, "-m", "pip", "install",
              "--break-system-packages",
              "--no-cache-dir",
              "--target", TARGET,
              "psycopg2-binary"
            ])

            os.makedirs(TARGET, exist_ok=True)
            with open(MARKER, "w"):
              pass

            os.execv(sys.executable, [sys.executable] + sys.argv)

          if not os.path.exists(MARKER):
            print("Installing Python dependencies...")
            install_deps_and_restart()

          import psycopg2

          from psycopg2 import sql, extras
          from datetime import datetime
          from psycopg2.extras import Json

          def insert_wrsd_tags(cursor, wrsd_tags):
            """
            Inserts or retrieves an existing wrsd_tags ID from perception_metrics_wrsd.
            """
            # Check if the wrsd_tags entry already exists
            cursor.execute("""
                SELECT id FROM wrsd."perception_metrics_wrsd"
                WHERE build_no = %s AND pipeline_name = %s;
            """, (wrsd_tags['build_no'], wrsd_tags['pipeline_name']))
            result = cursor.fetchone()
            # If exists, return id, else insert new and return new id
            if result:
              print("WRSD entry already exists")
              return result[0]
            else:
              print("Creating a new WRSD entry")

              cursor.execute("""
                  INSERT INTO wrsd."perception_metrics_wrsd" (build_no, pipeline_name, status, duration, build_url)
                  VALUES (%s, %s, %s, %s, %s) RETURNING id;
              """, (wrsd_tags['build_no'], wrsd_tags['pipeline_name'], wrsd_tags['status'], wrsd_tags['duration'], wrsd_tags['build_url']))
              result = cursor.fetchone()[0]

              return result

          def insert_perception_metrics(cursor, data_list):
            """
            Inserts multiple perception_metrics entries into the database.

            Parameters:
                data_list (list of dict): List of dictionaries, each containing data for a single entry.
            """
            for data in data_list:
              # First, insert or get the wrsd_tags ID
              wrsd_id = insert_wrsd_tags(cursor, data['wrsd_tags'])

              # Insert into PerceptionMetrics with reference to wrsd_id
              cursor.execute("""
                  INSERT INTO wrsd."perception_metrics" ("CommitId", date, branch, tag, project, metric_name, metric_value, metric_tags, wrsd_id)
                  VALUES (%s, %s, %s, %s, %s, %s, %s, %s, %s);
              """, (
                  data['commitid'],
                  data['date'],
                  data['branch'],
                  data['tag'],
                  data['project'],
                  data['metric_name'],
                  data['metric_value'],
                  Json(data['metric_tags']),
                  wrsd_id
              ))

          def read_file(file_path):
            """Read and return the contents of a file."""
            with open(os.path.expandvars(file_path), 'r') as file:
              return file.read().strip()

          def get_json_file(destination_path, variant, extract_base="/tmp"):
            """Find and extract json file from a ZIP file."""
            json_file = f"{variant}_platformHealth.json"
            print(f"json_file: {json_file}")

            print(f"Searching for ZIP in workspace: {destination_path}")

            for fname in os.listdir(destination_path):
              if fname.lower().endswith(".zip"):
                zip_file_path = os.path.join(destination_path, fname)
                extract_folder = os.path.join(extract_base, os.path.splitext(fname)[0])

                print(f"Extracting {zip_file_path} to {extract_folder}")
                os.makedirs(extract_folder, exist_ok=True)

                with zipfile.ZipFile(zip_file_path, 'r') as zip_ref:
                  zip_ref.extractall(extract_folder)

                for root,dirs,files in os.walk(extract_folder):
                  print(files)
                  if json_file in files:
                    print(f"Found files: {json_file}")
                    return (os.path.join(root,json_file))

            raise FileNotFoundError(
              f"No ZIP file found in workspace directory: {destination_path}"
            )

          def parse_smoke_test_results(file_path):
            """Parse smoke test resuts from the <variant>_platformHealth.json file."""
            try:
              with open(file_path, 'r') as file:
                  data = json.load(file)
              print(data)
              return data
            except FileNotFoundError:
              print(f"Error: File {file_path} not found.")
            except json.JSONDecodeError as e:
              print(f"Error parsing JSON: {e}")
            except Exception as e:
              print(f"Unexpected error: {e}")

          def parse_flash_memory(file_path):
            """Parse flash memory statistics from flash_memory_stats.txt."""
            flash_memory = []
            with open(file_path, 'r') as file:
              for line in file:
                # Parse utilization lines
                match = re.match(
                  r"^\s*(\S.*?):\s+([\d.]+)%\s+-\s+([\d.]+)\s+MB\s+of\s+([\d.]+)\s+MB", line
                )
                if match:
                  name, percentage, used_mb, total_mb = match.groups()
                  flash_memory.append({
                    'name': name.strip(),
                    'percentage': float(percentage),
                    'used_mb': float(used_mb),
                    'total_mb': float(total_mb)
                  })
                  continue

                # Parse total lines and addressed sections
                match = re.match(
                  r"^\s*(\S.*?):\s+([\d.]+)\s+KB\s+over\s+([\d.]+)\s+KB\s+span\s*\(\s*([\d.]+)%\s*\)\s+-\s+0x([\da-fA-F]+)\s+to\s+0x([\da-fA-F]+)",
                  line
                )
                if match:
                  name, used_kb, span_kb, percentage, start_address, end_address = match.groups()
                  flash_memory.append({
                    'name': name.strip(),
                    'used_kb': float(used_kb),
                    'span_kb': float(span_kb),
                    'percentage': float(percentage),
                    'start_address': f"0x{start_address}",
                    'end_address': f"0x{end_address}"
                  })
                  continue

                # Parse individual flash sections
                match = re.match(
                  r"^\s*(\S.*?):\s+([\d.]+)\s+KB\s+over\s+([\d.]+)\s+KB\s+span\s+\(([\d.]+)%\)", line
                )
                if match:
                  name, used_kb, span_kb, percentage = match.groups()
                  flash_memory.append({
                    'name': name.strip(),
                    'used_kb': float(used_kb),
                    'span_kb': float(span_kb),
                    'percentage': float(percentage)
                  })

                  continue

            return flash_memory

          def package_data_for_postgresql(base_data, variant, smoke_test_values):
            """Package parsed data into a list for database insertion."""
            data_list = []

            # smoke test results
            for values in smoke_test_values:
              data_list.append({
                **base_data,
                "metric_name": values["metricName"],
                "metric_tags": values["metricTags"] ,
                "metric_value": float(values["metricValue"]),
              })

            return data_list

            # Memory Sections
            for section in memory_sections:
              metric_name = "core_radar.gen7v2.memoryStats.sections"
              metric_tags = {"section": section["section_name"], "variant": variant}
              data_list.append({
                **base_data,
                "metric_name": metric_name,
                "metric_tags": {**metric_tags, "type": "total_kb"},
                "metric_value": float(section["total_kb"]),
              })
              data_list.append({
                **base_data,
                "metric_name": metric_name,
                "metric_tags": {**metric_tags, "type": "used_kb"},
                "metric_value": float(section["used_kb"]),
              })

            # Module Breakdown
            for module in module_breakdown:
              metric_name = "core_radar.gen7v2.memoryStats.modules"
              metric_tags = {"module": module["module_name"], "variant": variant}
              data_list.extend([
                {
                  **base_data,
                  "metric_name": metric_name,
                  "metric_tags": {**metric_tags, "type": "code_kb"},
                  "metric_value": float(module["code_kb"]),
                },
                {
                  **base_data,
                  "metric_name": metric_name,
                  "metric_tags": {**metric_tags, "type": "data_kb"},
                  "metric_value": float(module["data_kb"]),
                },
                {
                  **base_data,
                  "metric_name": metric_name,
                  "metric_tags": {**metric_tags, "type": "bss_kb"},
                  "metric_value": float(module["bss_kb"]),
                },
                {
                  **base_data,
                  "metric_name": metric_name,
                  "metric_tags": {**metric_tags, "type": "other_kb"},
                  "metric_value": float(module["other_kb"]),
                },
                {
                  **base_data,
                  "metric_name": metric_name,
                  "metric_tags": {**metric_tags, "type": "total_kb"},
                  "metric_value": float(module["total_kb"]),
                }
              ])

            # Flash Memory
            for flash in flash_memory:
              metric_name = "core_radar.gen7v2.memoryStats.flash"
              metric_tags = {"name": flash["name"], "variant": variant}

              if "used_mb" in flash:
                data_list.append({
                  **base_data,
                  "metric_name": metric_name,
                  "metric_tags": {**metric_tags, "type": "total_mb"},
                  "metric_value": float(flash["total_mb"]),
                })

                data_list.append({
                  **base_data,
                  "metric_name": metric_name,
                  "metric_tags": {**metric_tags, "type": "used_mb"},
                  "metric_value": float(flash["used_mb"]),
                })

              elif "used_kb" in flash:
                data_list.append({
