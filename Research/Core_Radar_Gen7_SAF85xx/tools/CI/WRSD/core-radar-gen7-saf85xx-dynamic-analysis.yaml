    steps:
      - name: publish
        image: system.registry.389177498442.awsaptiv.com/aptiv-core-radar/build-format-ready:2.0
        script: |
          #!/usr/bin/env python3

          import subprocess
          import sys
          import os
          import zipfile
          import json

          TARGET = "/tmp/python-packages"
          MARKER = os.path.join(TARGET, ".deps_installed")

          if TARGET not in sys.path:
              sys.path.insert(0, TARGET)

          def install_deps_and_restart():
              subprocess.check_call([
                  sys.executable, "-m", "pip", "install",
                  "--break-system-packages",
                  "--no-cache-dir",
                  "--target", TARGET,
                  "psycopg2-binary"
              ])

              os.makedirs(TARGET, exist_ok=True)
              with open(MARKER, "w"):
                  pass

              os.execv(sys.executable, [sys.executable] + sys.argv)

          if not os.path.exists(MARKER):
              print("Installing Python dependencies...")
              install_deps_and_restart()

          import psycopg2

          from psycopg2 import sql, extras
          from datetime import datetime
          from psycopg2.extras import Json

          def parse_extra_tags(extra_tags_str):
              """Parse a string of extra tags into a dictionary"""
              extra_tags = {}
              if extra_tags_str:
                  try:
                      extra_tags = json.loads(extra_tags_str)
                  except json.JSONDecodeError:
                      # Handle case where input is not valid JSON
                      for item in extra_tags_str.split(","):
                          key_value = item.split("=")
                          if len(key_value) == 2:
                              key, value = key_value
                              extra_tags[key.strip()] = value.strip()
              return extra_tags

          def read_file(file_path):
              """Reads a file and returns its contents."""
              with open(os.path.expandvars(file_path), 'r') as file:
                  return file.read().strip()

          def insert_wrsd_tags(cursor, wrsd_tags):
              """Inserts or retrieves an existing wrsd_tags ID from perception_metrics_wrsd."""
              cursor.execute("""
                  SELECT id FROM wrsd."perception_metrics_wrsd"
                  WHERE build_no = %s AND pipeline_name = %s;
              """, (wrsd_tags['build_no'], wrsd_tags['pipeline_name']))
              result = cursor.fetchone()
              if result:
                  return result[0]
              else:
                  cursor.execute("""
                      INSERT INTO wrsd."perception_metrics_wrsd" (build_no, pipeline_name, status, duration, build_url)
                      VALUES (%s, %s, %s, %s, %s) RETURNING id;
                  """, (wrsd_tags['build_no'], wrsd_tags['pipeline_name'], wrsd_tags['status'], wrsd_tags['duration'], wrsd_tags['build_url']))
                  return cursor.fetchone()[0]

          def insert_perception_metrics(cursor, data_list):
              """Inserts multiple perception_metrics entries into the database."""
              for data in data_list:
                  wrsd_id = insert_wrsd_tags(cursor, data['wrsd_tags'])
                  cursor.execute("""
                      INSERT INTO wrsd."perception_metrics" ("CommitId", date, branch, tag, project, metric_name, metric_value, metric_tags, wrsd_id)
                      VALUES (%s, %s, %s, %s, %s, %s, %s, %s, %s);
                  """, (
                      data['commitid'], data['date'], data['branch'], data['tag'],
                      data['project'], data['metric_name'], data['metric_value'],
                      Json(data['metric_tags']), wrsd_id
                  ))

          # Database connection details
          pg_user = read_file(r'$(secrets.postgresql-auth.username.path)')
          pg_pass = read_file(r'$(secrets.postgresql-auth.password.path)')

          db_config = {
              "dbname": "monitoring",
              "user": pg_user,
              "password": pg_pass,
              "host": "monitoring-wrds.c9qq8e0oklwk.eu-central-1.rds.amazonaws.com",
              "port": "5432"
          }

          # Extract metadata
          branch = "$(params.git-ref)"
          project_name = "$(params.project-name)"
          commit_hash = "$(params.commit-hash)"
          build_no = "$(config.pipeline.runNumber)"
          pipeline_name = "$(config.pipeline.name)"
          now = datetime.now()
          currentDateTime = now.strftime("%Y-%m-%d %H:%M:%S")
          extra_tags = parse_extra_tags("$(params.tags)")


          metric_tags = {"variant": "$(params.variant)"}
          metric_tags.update(extra_tags)

          sanitizer_metrics = [
              ("asan", "$(params.issue-count-asan)"),
              ("ubsan", "$(params.issue-count-ubsan)"),
              ("valgrind", "$(params.issue-count-valgrind)"),
          ]

          # Load the coverage results form the UT job
          data_list = [
              {
                  "commitid": commit_hash,"date": currentDateTime, "branch": branch, "tag": "",
                  "project": project_name, "metric_name": "core_radar.gen7v2.dynamicAnalysis",
                  "metric_value": value, "metric_tags": {**metric_tags, "sanitizer": category},
                  "wrsd_tags": { "build_no": build_no, "pipeline_name": pipeline_name,"status": None,"duration": None,
                      "build_url": f"https://$(studio.home)/plm/view/{pipeline_name}/runs/{build_no}",
                  },
              }
              for category, value in sanitizer_metrics
          ]

          print(f"Prepared {len(data_list)} records for database insertion.")

          for data in data_list:
            print(data)

          # Insert into the database
          if branch == "dev":
              try:
                  connection = psycopg2.connect(**db_config)
                  cursor = connection.cursor()

                  insert_perception_metrics(cursor, data_list)
                  connection.commit()
                  print("Data inserted successfully.")

              except Exception as e:
                  print(f"An error occurred: {e}")

              finally:
                  if connection:
                      cursor.close()
                      connection.close()
          else:
              print("Not Dev branch so nothing will be committed to Platform Health.")

        onError: continue
        ComputeResources: {}
        SecurityContext:
        Storage:
        WhenVal: false
    wrrn: ""

timeout: 1h
