# Note that ALL paths are relative to project root.

[cov-bazel]
# specify minimum cov-bazel version to run.
# if VERSION var in cov_bazel.py is updated, then devs
# who run cov-bazel and have smaller version, will
# get "please update" message.
min_version = "1.6.2"
# available: DEBUG, INFO, WARNING, ERROR, CRITICAL
log_level = "INFO"
# possible values: "bazel" and "generic"
build_system = "bazel"

[bazel] # used by build_system = "bazel"
# bazel $startup_flags build $build_flags
startup_flags = ""
build_flags = "--jobs=auto"

[generic] # used by build_system = "generic"
execroot = "Build" # folder where compiler is executed
build_cmd = "build.bat" # command to build software
clean_cmd = "clean.bat" # command to clean software

[coverity]
host = "coverity.asux.aptiv.com"
port = 443
ssl = true
# do not forget to add this dir to .gitignore/ignore.conf
dir = "covdir"
# config generated by cov-configure
compiler_config = "config/coverity_config.xml"
# EXAMPLE:
# cov-build $build_flags
build_flags = "--emit-complementary-info --return-emit-failures --parse-error-threshold 95"
# cov-analyze $analyze_flags
analyze_flags = "--hfa --enable-default --enable-callgraph-metrics --enable-fnptr --enable-virtual --enable-constraint-fpp --security --concurrency --checker-option DEADCODE:no_dead_default:true --checker-option RESOURCE_LEAK:allow_main:true --checker-option UNUSED_VALUE:report_unused_initializer:true"
# cov-run-desktop $run_desktop_flags
run_desktop_flags = "--set-new-defect-owner false"


[coverity.checkers]
# used by command "defects-compare".
# failure strategy values:
#  "ignore"                         - cov-bazel will ignore this checker
#  "fail"                           - will fail if warnings of this checker have been found, unconditionally
#  "fail-on-new"                    - will fail if new warnings have been found
#  "fail-on-new-high-impact"        - will fail if new warnings with high impact have been found
#  "fail-on-new-medium-high-impact" - will fail if new warnings with medium or high impact have been found

# default failure strategy
default = "fail-on-new-medium-high-impact"

# specify a list of checker names and corresponding failure strategies
# "Checker Name" = "strategy"
# EXAMPLE:
"MISRA C++-2008 Rule 16-3-2" = "ignore"
"MISRA C++-2008 Rule 2-7-3" = "fail"
"HFA" = "fail-on-new-medium-high-impact"

# MISRA Mandatory Rules
"MISRA C-2012 Rule 9-1" = "fail-on-new"
"MISRA C-2012 Rule 12-5" = "fail-on-new"
"MISRA C-2012 Rule 13-6" = "fail-on-new"
"MISRA C-2012 Rule 17-3" = "fail-on-new"
