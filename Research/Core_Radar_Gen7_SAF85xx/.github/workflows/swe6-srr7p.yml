# SWE6 SRR7p nightly trigger.
# Thin wrapper around radar-test-reusable.yml; only family-specific inputs change.

name: SWE6 SRR7p Nightly

on:
  schedule:
    # 19:30 UTC daily = 01:00 IST (UTC+5:30) — offset from FLR7 to free the bench
    - cron: '30 19 * * *'
  workflow_dispatch:

concurrency:
  group: swe6-srr7p
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  swe6-srr7p:
    name: SWE6 SRR7p
    uses: ./.github/workflows/radar-test-reusable.yml
    with:
      # ---- Identity ----
      job-type: SWE6
      family: SRR7p
      job-url: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/swe6-srr7p.yml
      gen-version: Gen7v2
      # ---- Build artifact ----
      nightly-artifact-jfrog-path: core_radar-aptiv-00000000-gen7_saf85xx-local/wrsd/saf85xx/nightly/latest/output_srr7p.zip
      # ---- Test framework ----
      toml-file: SRR7p_SQTp_pyproject.toml
      ci-cd-environment: true
      # ---- Report selection / JFrog destinations ----
      report-name-filter: GUI
      jfrog-reports-subpath: SWE6/Reports
      jfrog-latest-subpath: SWE6/latest_report
      # ---- Notification ----
      email-subject-prefix: 'Gen7v2 SWE6 (SRR7p) Nightly'
      email-recipients: >-
        Ampavathina.Trivikram@aptiv.com;
        Arjun.Duraisamy@aptiv.com;
