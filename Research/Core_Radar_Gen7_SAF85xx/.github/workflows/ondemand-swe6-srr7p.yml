# On-demand: SWE6 SRR7p nightly test re-run.
#
# Companion to swe6-srr7p.yml (which runs nightly at 19:30 UTC).

name: "On-demand · SWE6 SRR7p"

on:
  workflow_dispatch:
    inputs:
      nightly-artifact-jfrog-path:
        description: 'Optional override of the JFrog artifact path (default = nightly/latest/output_srr7p.zip)'
        required: false
        type: string
        default: 'core_radar-aptiv-00000000-gen7_saf85xx-local/wrsd/saf85xx/nightly/latest/output_srr7p.zip'
      email-recipients:
        description: 'Optional override of email recipients (semicolon-separated). Leave blank to use the default distribution list.'
        required: false
        type: string
        default: ''

concurrency:
  group: ondemand-swe6-srr7p-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  swe6-srr7p:
    name: SWE6 SRR7p (on-demand)
    uses: ./.github/workflows/radar-test-reusable.yml
    with:
      job-type: SWE6
      family: SRR7p
      job-url: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/ondemand-swe6-srr7p.yml
      gen-version: Gen7v2
      nightly-artifact-jfrog-path: ${{ inputs.nightly-artifact-jfrog-path }}
      toml-file: SRR7p_SQTp_pyproject.toml
      ci-cd-environment: true
      report-name-filter: GUI
      jfrog-reports-subpath: SWE6/Reports
      jfrog-latest-subpath: SWE6/latest_report
      email-subject-prefix: 'Gen7v2 SWE6 (SRR7p) On-demand'
      email-recipients: ${{ inputs.email-recipients }}
    secrets: inherit
