# SWE5 nightly trigger for the SRR7p family.
# Thin wrapper around the generic reusable workflow (radar-test-reusable.yml).

name: SWE5 SRR7p Nightly

on:
  # workflow_run:
  #   workflows: ["SWE6 SRR7p Nightly"]
  #   types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swe5-srr7p:
    name: SWE5 SRR7p
    uses: ./.github/workflows/radar-test-reusable.yml
    with:
      job-type: SWE5
      family: SRR7p
      job-url: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/swe5-srr7p.yml
      nightly-artifact-jfrog-path: core_radar-aptiv-00000000-gen7_saf85xx-local/wrsd/saf85xx/nightly/latest/output_srr7p.zip
      toml-file: SRR7p_SQTp_pyproject.toml
      ci-cd-environment: true
      test-folder: SWE5_Testing
      bench-attributes: 'Variant=SRR7p_V2'
      report-subdir: Reports/SWE5
      jfrog-reports-subpath: SWE5/Reports
      jfrog-latest-subpath: SWE5/latest_report
      email-subject-prefix: 'Gen7v2 SWE5 (SRR7p)'
      email-recipients: 'Jonnalagadda.Sai.Dheeraj@aptiv.com'
    secrets: inherit
