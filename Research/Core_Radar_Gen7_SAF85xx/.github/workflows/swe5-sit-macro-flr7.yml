# SWE5 SIT_MACRO nightly trigger for the FLR7 family.
# Thin wrapper around the generic reusable workflow (radar-test-reusable.yml).
#
# Source folder + report subdir match launcher_config.toml GEN7_V2.folder_map:
#   SWE5_TestScript_SIT_MACRO -> Reports/SWE5_SIT_MACRO

name: SWE5 SIT_MACRO FLR7 Nightly

on:
  # workflow_run:
  #   workflows: ["SWE6 FLR7 Nightly"]
  #   types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sit-macro-flr7:
    name: SWE5 SIT_MACRO FLR7
    uses: ./.github/workflows/radar-test-reusable.yml
    with:
      job-type: SWE5_SIT_MACRO
      family: FLR7
      job-url: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/swe5-sit-macro-flr7.yml
      nightly-artifact-jfrog-path: core_radar-aptiv-00000000-gen7_saf85xx-local/wrsd/saf85xx/nightly/latest/output_flr7.zip
      toml-file: FLR7_SQTp_pyproject_CICD.toml
      ci-cd-environment: true
      test-folder: SWE5_TestScript_SIT_MACRO
      bench-attributes: 'Variant=FLR7_V2'
      report-subdir: Reports/SWE5_SIT_MACRO
      jfrog-reports-subpath: SWE5_SIT_MACRO/Reports
      jfrog-latest-subpath: SWE5_SIT_MACRO/latest_report
      email-subject-prefix: 'Gen7v2 SWE5 SIT_MACRO (FLR7)'
      email-recipients: 'Jonnalagadda.Sai.Dheeraj@aptiv.com'
    secrets: inherit
