# SWE5 nightly trigger for the FLR7 family.
# Thin wrapper around the generic reusable workflow (radar-test-reusable.yml).
#
# SKELETON — adjust the bench-attributes, runner-labels (if a different bench
# is preferred), email-recipients, and any markers/extra-args.
#
# Triggers:
#   - workflow_dispatch: manual trigger via the Actions UI (ONLY trigger today).
#
#   TODO: when ready to chain after SWE6 FLR7 Nightly, uncomment the
#   `workflow_run` block below.

name: SWE5 FLR7 Nightly

on:
  # workflow_run:
  #   workflows: ["SWE6 FLR7 Nightly"]
  #   types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swe5-flr7:
    name: SWE5 FLR7
    uses: ./.github/workflows/radar-test-reusable.yml
    with:
      job-type: SWE5
      family: FLR7
      job-url: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/swe5-flr7.yml
      nightly-artifact-jfrog-path: core_radar-aptiv-00000000-gen7_saf85xx-local/wrsd/saf85xx/nightly/latest/output_flr7.zip
      toml-file: FLR7_SQTp_pyproject_CICD.toml
      ci-cd-environment: true
      test-folder: SWE5_Testing
      bench-attributes: 'Variant=FLR7_V2'
      report-subdir: Reports/SWE5
      jfrog-reports-subpath: SWE5/Reports
      jfrog-latest-subpath: SWE5/latest_report
      email-subject-prefix: 'Gen7v2 SWE5 (FLR7)'
      email-recipients: 'Jonnalagadda.Sai.Dheeraj@aptiv.com'
    secrets: inherit
