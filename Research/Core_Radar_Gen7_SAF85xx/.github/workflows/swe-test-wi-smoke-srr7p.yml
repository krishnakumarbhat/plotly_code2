# SWE-Test - Focused Work-Item smoke run on SRR7p.
#
# Demonstrates:
#   * markers        -> bracket notation with multiple WIs (OR within group)
#   * project-name / team-name overrides in the report metadata
#   * no-reports: false + gui-html: true (defaults, shown explicitly)
#   * Custom report-subdir so smoke reports don't collide with nightly reports.
#
# Trigger: manual only.

name: SWE-Test - WI Smoke SRR7p

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wi-smoke-srr7p:
    name: WI Smoke SRR7p
    uses: ./.github/workflows/radar-test-reusable.yml
    with:
      job-type: WI_SMOKE
      family: SRR7p
      job-url: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/swe-test-wi-smoke-srr7p.yml
      nightly-artifact-jfrog-path: core_radar-aptiv-00000000-gen7_saf85xx-local/wrsd/saf85xx/nightly/latest/output_srr7p.zip
      toml-file: SRR7p_SQTp_pyproject.toml
      ci-cd-environment: true
      test-folder: SWE6_Testing
      markers: 'WI=[WI-266881, WI-266882] TestType=XCP-Regression'
      bench-attributes: 'Variant=SRR7p_V2'
      project-name: 'Radar_Gen7v2'
      team-name: 'SAF85xx_Smoke'
      no-reports: false
      gui-html: true
      # Keep smoke artifacts isolated from the main nightly tree on JFrog.
      report-subdir: Reports/Smoke/WI
      jfrog-reports-subpath: SMOKE/WI/Reports
      jfrog-latest-subpath: SMOKE/WI/latest_report
      email-subject-prefix: 'Gen7v2 WI Smoke (SRR7p)'
      email-recipients: 'Jonnalagadda.Sai.Dheeraj@aptiv.com'
    secrets: inherit
