# Reusable Coverity Workflow for AWR294X (Gen7).
#
# Mirrors Jenkins tools/Jenkins/coverityJob. The Jenkins build commands have the
# Gen8-style shape (target label + --variant flag), e.g.
#   //software/app/mss/src:aptivMss --variant=srr7p
# and optionally `--awr_target_variant=awr2944eco` for the ECO flavor.
#
# Matrix item shape:
#   {variant, core, coverity_target, coverity_stream, target_variant?}

name: Reusable Coverity (AWR294X)

on:
  workflow_call:
    inputs:
      matrix-json:
        description: 'JSON array; each item: variant, core, coverity_target, coverity_stream, target_variant?'
        required: true
        type: string
      pr-number:
        description: 'PR number for failure-label management'
        required: false
        type: string
        default: ''
      nightly:
        description: 'When true, commits defects against the merged commit (--config=cov_commit)'
        required: false
        type: boolean
        default: false
      container-image:
        required: false
        type: string
        default: 'jfrog.asux.aptiv.com/core_radar-aptiv-00000000-docker-local/coverity-build-ready:1.7'
      runner:
        required: false
        type: string
        default: 'gh-injected-gpo-linux-medium'
      bazel-extra-flags:
        required: false
        type: string
        default: '--jobs=36'
    secrets:
      ADVRADAR_GHCR_USER: {required: true}
      ADVRADAR_GHCR_TOKEN: {required: true}
      ADVRADAR_NETRC_CONTENT: {required: true}
      ADVRADAR_ARB_TOKEN: {required: true}
      ADVRADAR_COVERITY_COMMITTER_AUTH: {required: true}

jobs:
  coverity:
    name: Coverity (${{ matrix.variant }}-${{ matrix.core }}${{ matrix.target_variant && '-eco' || '' }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.matrix-json) }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
    runs-on: ${{ inputs.runner }}
    container:
      image: ${{ inputs.container-image }}
      credentials:
        username: ${{ secrets.ADVRADAR_GHCR_USER }}
        password: ${{ secrets.ADVRADAR_GHCR_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: ./.github/actions/configure-netrc
        with: {netrc-content: "${{ secrets.ADVRADAR_NETRC_CONTENT }}"}

      - uses: ./.github/actions/configure-bazel-cache
        with: {arb-token: "${{ secrets.ADVRADAR_ARB_TOKEN }}"}

      - uses: ./.github/actions/setup-coverity-auth
        with:
          coverity-auth: "${{ secrets.ADVRADAR_COVERITY_COMMITTER_AUTH }}"
          base64: 'true'

      - id: bazelisk
        uses: ./.github/actions/setup-bazelisk

      - name: Run commit_defects
        id: cov_commit
        shell: bash
        continue-on-error: true
        env:
          VARIANT: ${{ matrix.variant }}
          CORE: ${{ matrix.core }}
          COV_STREAM: ${{ matrix.coverity_stream }}
          COV_TARGET: ${{ matrix.coverity_target }}
          TARGET_VARIANT: ${{ matrix.target_variant || '' }}
          NIGHTLY: ${{ inputs.nightly }}
        run: |
          set -euo pipefail
          COMMIT_PARAM=""
          if [ "${NIGHTLY}" = "true" ]; then
            COMMIT_PARAM="--config=cov_commit"
          fi
          ECO_FLAG=""
          if [ -n "${TARGET_VARIANT}" ]; then
            ECO_FLAG="--awr_target_variant=${TARGET_VARIANT}"
          fi
          ${{ steps.bazelisk.outputs.bazelisk-path }} run ${COV_TARGET} \
            ${{ inputs.bazel-extra-flags }} \
            --variant=${VARIANT} ${ECO_FLAG} ${COMMIT_PARAM} \
            --build_event_json_file=build_event.json \
            -- --auth-key-file="${COVERITY_AUTH_FILE}" \
            2>&1 | tee coverity_build.log

      - name: Summarise Coverity result
        if: always()
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
          CORE: ${{ matrix.core }}
          STREAM: ${{ matrix.coverity_stream }}
        run: |
          set -uo pipefail
          NEW_ISSUES=""
          if grep -q 'ERROR: Introduced [0-9]\+ new defects' coverity_build.log 2>/dev/null; then
            NEW_ISSUES=$(grep -m1 -Eo 'Introduced [0-9]+ new defects' coverity_build.log)
          fi
          {
            echo "## Coverity (${VARIANT}-${CORE})"
            echo ""
            echo "- Stream: \`${STREAM}\`"
            echo "- Outcome: ${{ steps.cov_commit.outcome }}"
            if [ -n "${NEW_ISSUES}" ]; then
              echo "- :warning: ${NEW_ISSUES}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Coverity log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverity-${{ matrix.variant }}-${{ matrix.core }}${{ matrix.target_variant && '-eco' || '' }}
          path: coverity_build.log
          if-no-files-found: warn

      - name: Update failure label on PR
        if: always() && inputs.pr-number != '' && steps.cov_commit.outcome != 'success' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LABEL: coverity failed - ${{ matrix.variant }}-${{ matrix.core }}
        shell: bash
        run: |
          set -e
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${{ inputs.pr-number }}/labels" \
            -f "labels[]=${LABEL}" || echo "::warning::Failed to add label '${LABEL}'"
