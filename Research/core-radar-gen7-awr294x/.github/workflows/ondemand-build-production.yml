# On-demand: build the production flavor for a chosen variant.

name: On-Demand · Build Production

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Sensor variant'
        type: choice
        options: [srr7p, flr7]
        default: srr7p

jobs:
  build:
    uses: ./.github/workflows/build-flavors.yml
    with:
      flavors: '["production"]'
      variants: '["${{ inputs.variant }}"]'
    secrets:
      ADVRADAR_GHCR_USER: ${{ secrets.ADVRADAR_GHCR_USER }}
      ADVRADAR_GHCR_TOKEN: ${{ secrets.ADVRADAR_GHCR_TOKEN }}
      ADVRADAR_NETRC_CONTENT: ${{ secrets.ADVRADAR_NETRC_CONTENT }}
      ADVRADAR_ARB_TOKEN: ${{ secrets.ADVRADAR_ARB_TOKEN }}
