# Reusable Bazel Build Workflow for AWR294X (Gen7 Core Radar).
#
# Mirrors the Jenkins tools/Jenkins/buildJob (driven by the shared library
# `ADVRADAR_CICD.buildAndUploadAndVote`). Matrix-driven fan-out by flavor/variant,
# build-event-json capture, flash & memory step summary, artifact upload,
# optional PR failure-label management.
#
# Defaults follow the verifiedJob/nightlyJob Jenkinsfiles:
#   target  = //:gen7
#   variant = srr7p
#   bazel-extra-flags = --color=yes --jobs=auto --//:jenkins

name: Reusable Bazel Build (AWR294X)

on:
  workflow_call:
    inputs:
      target:
        description: 'Bazel build target (e.g. //:gen7)'
        required: false
        type: string
        default: '//:gen7'
      variant:
        description: 'Sensor variant (srr7p | flr7 | srr7hd)'
        required: false
        type: string
        default: 'srr7p'
      matrix-json:
        description: |
          JSON include array for matrix fan-out. Each item may set:
            name, variant, bazel_target, bazel_extra_flags,
            target_variant (e.g. awr2944eco for ECO flavor),
            rot (e.g. standalone),
            upload_artifact_name, upload_artifact_path.
        required: false
        type: string
        default: '[{"name":"srr7p-production","variant":"srr7p"},{"name":"flr7-production","variant":"flr7"}]'
      pr-number:
        description: 'PR number for failure-label management'
        required: false
        type: string
        default: ''
      nightly:
        description: 'When true, allows upload of local cache results to ARB'
        required: false
        type: boolean
        default: false
      container-image:
        description: 'Container image for the build'
        required: false
        type: string
        default: 'jfrog.asux.aptiv.com/core_radar-aptiv-00000000-docker-local/build-format-ready:1.6'
      runner:
        description: 'Runner label'
        required: false
        type: string
        default: 'gh-injected-gpo-linux-medium'
      bazel-extra-flags:
        description: 'Extra Bazel flags appended to build'
        required: false
        type: string
        default: '--color=yes --jobs=auto --//:jenkins'
      upload-artifact-name:
        description: 'Default uploaded artifact name (matrix may override)'
        required: false
        type: string
        default: 'awr294x-build-output'
      upload-artifact-path:
        description: 'Artifact path to upload'
        required: false
        type: string
        default: 'bazel-bin/outputs'
    secrets:
      ADVRADAR_GHCR_USER: {required: true}
      ADVRADAR_GHCR_TOKEN: {required: true}
      ADVRADAR_NETRC_CONTENT: {required: true}
      ADVRADAR_ARB_TOKEN: {required: true}

jobs:
  build:
    name: Build (${{ matrix.name || matrix.variant || inputs.variant }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.matrix-json) }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
    runs-on: ${{ inputs.runner }}
    container:
      image: ${{ inputs.container-image }}
      credentials:
        username: ${{ secrets.ADVRADAR_GHCR_USER }}
        password: ${{ secrets.ADVRADAR_GHCR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Configure git safe.directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure netrc
        uses: ./.github/actions/configure-netrc
        with:
          netrc-content: ${{ secrets.ADVRADAR_NETRC_CONTENT }}

      - name: Configure bazel remote cache
        uses: ./.github/actions/configure-bazel-cache
        with:
          arb-token: ${{ secrets.ADVRADAR_ARB_TOKEN }}

      - name: Setup bazelisk
        id: bazelisk
        uses: ./.github/actions/setup-bazelisk

      - name: Bazel build
        id: build
        shell: bash
        env:
          VARIANT: ${{ matrix.variant || inputs.variant }}
          BAZEL_TARGET: ${{ matrix.bazel_target || inputs.target }}
          TARGET_VARIANT: ${{ matrix.target_variant || '' }}
          ROT: ${{ matrix.rot || '' }}
          NIGHTLY: ${{ inputs.nightly }}
          GIT_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          EXTRA=""
          if [ -n "${TARGET_VARIANT}" ]; then
            EXTRA="${EXTRA} --awr_target_variant=${TARGET_VARIANT}"
          fi
          if [ -n "${ROT}" ]; then
            EXTRA="${EXTRA} --rot=${ROT}"
          fi
          if [ "${NIGHTLY}" = "true" ]; then
            EXTRA="${EXTRA} --remote_upload_local_results"
          fi
          ${{ steps.bazelisk.outputs.bazelisk-path }} build ${BAZEL_TARGET} \
            --variant=${VARIANT} \
            ${{ matrix.bazel_extra_flags || inputs.bazel-extra-flags }} \
            --gitBranch=${GIT_BRANCH} \
            ${EXTRA} \
            --build_event_json_file=build_event.json

      - name: Extract RapidBuild invocation URL
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          if [ -f build_event.json ]; then
            INV=$(grep -Po '"uuid":"\K[^"]+' build_event.json | head -n1 || true)
            if [ -n "${INV:-}" ]; then
              echo "RAPIDBUILD_URL=https://rapidbuild.asux.aptiv.com/organizations/gpo/projects/ADVRADAR_AWR294X/invocations/${INV}" >> "$GITHUB_ENV"
            fi
          fi

      - name: Report build results
        if: always()
        shell: bash
        env:
          VARIANT: ${{ matrix.variant || inputs.variant }}
          BAZEL_TARGET: ${{ matrix.bazel_target || inputs.target }}
          OUTPUT_DIR: ${{ matrix.upload_artifact_path || inputs.upload-artifact-path }}
        run: |
          set -uo pipefail
          ICON="❌"; STATUS="Build Failed"
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            ICON="✅"; STATUS="Build Successful"
          fi

          FLASH_PCT=""; MEM_PCT=""
          if [ -d "${OUTPUT_DIR}" ]; then
            FLASH_FILE=$(find "${OUTPUT_DIR}" -type f -name "flash_memory_stats.txt" 2>/dev/null | head -n1 || true)
            MEM_FILE=$(find "${OUTPUT_DIR}" -type f -name "memoryStats.txt" 2>/dev/null | head -n1 || true)
            [ -n "$FLASH_FILE" ] && FLASH_PCT=$(grep -m1 -Eo 'Flash utilization:[[:space:]]*[0-9.]+%' "$FLASH_FILE" | grep -Eo '[0-9.]+' || true)
            [ -n "$MEM_FILE" ]   && MEM_PCT=$(grep -m1 -Eo '[0-9.]+%' "$MEM_FILE" | head -n1 | tr -d '%' || true)
          fi

          {
            echo "${ICON} **${STATUS}**"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Flavor | \`${{ matrix.name || matrix.variant || inputs.variant }}\` |"
            echo "| Target | \`${BAZEL_TARGET}\` |"
            echo "| Variant | \`${VARIANT}\` |"
            echo "| Output | \`${OUTPUT_DIR}\` |"
            echo "| Flash | ${FLASH_PCT:-n/a}% |"
            echo "| Memory | ${MEM_PCT:-n/a}% |"
            if [ -n "${RAPIDBUILD_URL:-}" ]; then
              echo "| RapidBuild | ${RAPIDBUILD_URL} |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build outputs
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.upload_artifact_name || format('{0}-{1}', inputs.upload-artifact-name, matrix.name || matrix.variant || inputs.variant) }}
          path: ${{ matrix.upload_artifact_path || inputs.upload-artifact-path }}
          if-no-files-found: error

      - name: Update failure label on PR
        if: always() && inputs.pr-number != '' && steps.build.outcome != 'success' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LABEL: build failed - ${{ matrix.name || matrix.variant || inputs.variant }}
        shell: bash
        run: |
          set -e
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${{ inputs.pr-number }}/labels" \
            -f "labels[]=${LABEL}" || echo "::warning::Failed to add label '${LABEL}'"
