# Quality Checks — event-aware quality gates for AWR294X (Gen7).
#
# Mirrors tools/Jenkins/verifiedJob/Jenkinsfile:
#   - Formatter Check               → precommit
#   - Build & Integration Test      → build (production flavor) + (gated) hw_test
#   - Build Standalone (srr7p only) → build (standalone flavor)
#   - Build ECO                     → build (eco flavor)
#   - 4x Coverity + 4x Coverity-ECO → coverity (matrix)
#   - Unit Tests                    → unit_test
#   - Dynamic Analysis              → dynamic_analysis (asan/ubsan/valgrind)
#
# HW smoke (`integrationJob`) remains gated until a GitHub-registered bench
# runner with the matching Gen7 labels exists.

name: Quality Checks

on:
  pull_request:
    branches: [dev, main, 'release/**']
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [dev, main, 'release/**']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch name or full commit SHA to check out'
        required: false
        default: ''
        type: string
      smoke_test_runner:
        description: 'Runner labels for the optional Gen7 smoke test (JSON array)'
        required: false
        default: '["self-hosted","windows","SmokeTest","Gen7","AWR294x"]'
        type: string

concurrency:
  # Keep merge-queue, push, and manual runs independent; cancel only duplicate PR runs.
  group: gen7v1-quality-checks-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr_status_start:
    name: PR Status (start)
    runs-on: gh-injected-gpo-linux-medium
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 1}
      - uses: ./.github/actions/pr-status-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          job-precommit: in progress...
          job-dependency-scan: in progress...
          job-build: in progress...
          job-unit-test: in progress...
          job-coverity: in progress...
          job-dynamic-analysis: in progress...
          job-hw-test: in progress...

  # Match the Gen8 workflow's documentation-only optimization while retaining
  # AWR's local Gen7 build/test workflows and their interfaces.
  check_skip:
    name: Check Documentation Changes
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'merge_group'
    uses: Aptiv/workflows-library/.github/workflows/skip-on-docs.yml@v3
    with:
      additional-doc-patterns: |
        **/*.doc
        **/*.pdf
        **/*.md
    permissions:
      pull-requests: read
      contents: read

  pr_validation:
    name: Validate PR JIRA Tickets
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    uses: Aptiv/workflows-library/.github/workflows/pr-validation.yml@v3
    permissions:
      pull-requests: write
      contents: read
      issues: write
    with:
      runner: ${{ vars.ADVRADAR_RUNNER_SMALL || 'gh-injected-gpo-linux-small' }}
      jira-project-keys: ${{ vars.ADVRADAR_JIRA_KEY_LIST }}
      commit-message-pattern: '([A-Z]+-[0-9]+)'
      required-status: ${{ vars.ADVRADAR_JIRA_REQUIRED_STATUS }}
      send-feedback: true
      jira-url: ${{ vars.JIRA_URL }}
    secrets:
      JIRA_TOKEN: ${{ secrets.ADVRADAR_SID_JIRA_API_KEY }}

  precommit:
    name: Pre-commit
    needs: [check_skip]
    if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || needs.check_skip.outputs.should_skip != 'true')
    runs-on: gh-injected-gpo-linux-medium
    container:
      image: jfrog.asux.aptiv.com/core_radar-aptiv-00000000-docker-local/build-format-ready:1.6
      credentials:
        username: ${{ secrets.ADVRADAR_GHCR_USER }}
        password: ${{ secrets.ADVRADAR_GHCR_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          submodules: recursive
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/configure-netrc
        with: {netrc-content: "${{ secrets.ADVRADAR_NETRC_CONTENT }}"}
      - uses: ./.github/actions/configure-bazel-cache
        with: {arb-token: "${{ secrets.ADVRADAR_ARB_TOKEN }}"}
      - name: Install pre-commit
        run: pip install --quiet pre-commit
      - name: Run pre-commit on changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pre-commit run --from-ref "$BASE_SHA" --to-ref "$HEAD_SHA" --show-diff-on-failure
          else
            pre-commit run --all-files --show-diff-on-failure
          fi

  dependency_scan:
    name: Dependency Scan
    needs: [check_skip]
    if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || needs.check_skip.outputs.should_skip != 'true')
    runs-on: gh-injected-gpo-linux-medium
    container:
      image: jfrog.asux.aptiv.com/core_radar-aptiv-00000000-docker-local/build-format-ready:1.6
      credentials:
        username: ${{ secrets.ADVRADAR_GHCR_USER }}
        password: ${{ secrets.ADVRADAR_GHCR_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          submodules: recursive
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/configure-netrc
        with: {netrc-content: "${{ secrets.ADVRADAR_NETRC_CONTENT }}"}
      - uses: ./.github/actions/configure-bazel-cache
        with: {arb-token: "${{ secrets.ADVRADAR_ARB_TOKEN }}"}
      - id: bazelisk
        uses: ./.github/actions/setup-bazelisk
      - name: Bazel query reverse-deps of changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -E '\.(c|h|bzl|BUILD)$' || true)
          elif [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.event.before }}" ]; then
            CHANGED=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -E '\.(c|h|bzl|BUILD)$' || true)
          else
            CHANGED=$(git ls-files | grep -E '\.(c|h|bzl|BUILD)$' || true)
          fi
          if [ -z "$CHANGED" ]; then
            echo "No buildable files changed."; exit 0
          fi
          for F in $CHANGED; do
            ${{ steps.bazelisk.outputs.bazelisk-path }} query "rdeps(//..., $F, 1)" --output=label 2>/dev/null || true
          done | sort -u | tee dep_scan.txt

  build:
    name: Build - ${{ matrix.name }}
    needs: [check_skip]
    if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || needs.check_skip.outputs.should_skip != 'true')
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: srr7p-production
            variant: srr7p
            bazel_extra_flags: '--color=yes --jobs=auto --//:jenkins'
          - name: flr7-production
            variant: flr7
            bazel_extra_flags: '--color=yes --jobs=auto --//:jenkins'
          - name: srr7p-standalone
            variant: srr7p
            bazel_extra_flags: '--color=yes --jobs=auto --//:jenkins --rot=standalone'
          - name: srr7p-eco
            variant: srr7p
            bazel_extra_flags: '--color=yes --jobs=auto --//:jenkins --awr_target_variant=awr2944eco'
          - name: flr7-eco
            variant: flr7
            bazel_extra_flags: '--color=yes --jobs=auto --//:jenkins --awr_target_variant=awr2944eco'
    uses: Aptiv/workflows-library/.github/workflows/build-analyze-linux.yml@v3
    with:
      runner: ${{ vars.ADVRADAR_RUNNER_MEDIUM_CORERADAR || 'gh-injected-gpo-linux-medium' }}
      build-type: build
      analyze-type: none
      analyze-targets: ''
      scm-type: mono-repo
      gitsubmodules-pull: false
      sarif-enabled: false
      toolchain-cache-enabled: false
      should_skip: ${{ needs.check_skip.outputs.should_skip || 'false' }}
      artifact-name: 'build-${{ matrix.name }}'
      additional-artifacts: |
        bazel-bin/outputs
        build_status.txt
      script: |
        set -euo pipefail
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        chmod +x ./bazelisk

        BUILD_CMD=(./bazelisk build //:gen7 "--variant=${{ matrix.variant }}")
        read -r -a EXTRA_FLAGS <<< "${{ matrix.bazel_extra_flags }}"
        BUILD_CMD+=("${EXTRA_FLAGS[@]}" --build_event_json_file=build_event.json)

        echo "**** Bazel command:"
        printf '%q ' "${BUILD_CMD[@]}"
        echo

        MAX_RETRIES=2
        INITIAL_DELAY=5
        attempt=1
        delay=$INITIAL_DELAY
        while true; do
          echo "[BUILD] Attempt ${attempt}/${MAX_RETRIES}"
          set +e
          "${BUILD_CMD[@]}"
          BUILD_RC=$?
          set -e
          if [ "$BUILD_RC" -eq 0 ] || [ "$attempt" -ge "$MAX_RETRIES" ]; then
            break
          fi
          echo "::notice::Build failed (attempt ${attempt}). Retrying in ${delay}s..."
          sleep "$delay"
          attempt=$((attempt + 1))
          delay=$((delay * 2))
        done

        echo "${BUILD_RC}" > build_status.txt
        exit "${BUILD_RC}"
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      GHCR_USER: ${{ secrets.ADVRADAR_GHCR_USER }}
      GHCR_TOKEN: ${{ secrets.ADVRADAR_GHCR_TOKEN }}
      CONTEXT_SECRETS: >-
        {
          "GERRIT_USER": "${{ secrets.ADVRADAR_SID_USERNAME }}",
          "GERRIT_TOKEN": "${{ secrets.ADVRADAR_SID_GERRIT_HTTP_KEY }}",
          "JFROG_USERNAME": "${{ secrets.ADVRADAR_SID_USERNAME }}",
          "JFROG_PASSWORD": "${{ secrets.ADVRADAR_JFROG_API_KEY }}",
          "ARB_TOKEN": "${{ secrets.ADVRADAR_ARB_TOKEN }}"
        }

  unit_test:
    name: Unit Tests - ${{ matrix.variant }}-${{ matrix.core }}
    needs: [check_skip]
    if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || needs.check_skip.outputs.should_skip != 'true')
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: srr7p
            core: mss
          - variant: srr7p
            core: dss
            extra_config: dss_ut
          - variant: flr7
            core: mss
          - variant: flr7
            core: dss
            extra_config: dss_ut
    uses: Aptiv/workflows-library/.github/workflows/unit-test-linux.yml@v3
    with:
      runner: ${{ vars.ADVRADAR_RUNNER_MEDIUM_CORERADAR || 'gh-injected-gpo-linux-medium' }}
      image: 'jfrog.asux.aptiv.com/core_radar-aptiv-00000000-docker-local/gut-ready:1.5'
      scm-type: mono-repo
      gitsubmodules-pull: false
      lfs-enabled: false
      should_skip: ${{ needs.check_skip.outputs.should_skip || 'false' }}
      coverage-tool: none
      coverage-threshold: '0'
      artifact-name: 'unit-test-${{ matrix.variant }}-${{ matrix.core }}'
      additional-artifacts: |
        unit_test.log
        bazel-testlogs/**/test.xml
        bazel-out/_coverage/_coverage_report.dat
      script: |
        set -euo pipefail
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        chmod +x ./bazelisk

        TEST_CMD=(./bazelisk test "//:all_unit_tests_${{ matrix.core }}"
          "--variant=${{ matrix.variant }}"
          --color=yes
          --test_output=errors
          --//:jenkins)
        if [ "${{ matrix.core }}" = "dss" ]; then
          TEST_CMD+=(--config=${{ matrix.extra_config }})
        fi

        echo "**** Bazel command:"
        printf '%q ' "${TEST_CMD[@]}"
        echo
        "${TEST_CMD[@]}" 2>&1 | tee unit_test.log
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      GHCR_USER: ${{ secrets.ADVRADAR_GHCR_USER }}
      GHCR_TOKEN: ${{ secrets.ADVRADAR_GHCR_TOKEN }}
      CONTEXT_SECRETS: >-
        {
          "GERRIT_USER": "${{ secrets.ADVRADAR_SID_USERNAME }}",
          "GERRIT_TOKEN": "${{ secrets.ADVRADAR_SID_GERRIT_HTTP_KEY }}",
          "JFROG_USERNAME": "${{ secrets.ADVRADAR_SID_USERNAME }}",
          "JFROG_PASSWORD": "${{ secrets.ADVRADAR_JFROG_API_KEY }}",
          "ARB_TOKEN": "${{ secrets.ADVRADAR_ARB_TOKEN }}"
        }

  coverity:
    name: Coverity - ${{ matrix.name }}
    needs: [check_skip]
    if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || needs.check_skip.outputs.should_skip != 'true')
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: srr7p-mss
            variant: srr7p
            core: mss
            bazel_target: //software/app/mss/src:aptivMssApp.elf
            coverity_target: srr7p_mss_misrac
            coverity_stream: ADVRADAR_SRR7p_Mss
          - name: srr7p-dss
            variant: srr7p
            core: dss
            bazel_target: //software/app/dss/src:aptivDssApp.elf
            coverity_target: srr7p_dss_misrac
            coverity_stream: ADVRADAR_SRR7p_Dss
          - name: flr7-mss
            variant: flr7
            core: mss
            bazel_target: //software/app/mss/src:aptivMssApp.elf
            coverity_target: flr7_mss_misrac
            coverity_stream: ADVRADAR_FLR7_Mss
          - name: flr7-dss
            variant: flr7
            core: dss
            bazel_target: //software/app/dss/src:aptivDssApp.elf
            coverity_target: flr7_dss_misrac
            coverity_stream: ADVRADAR_FLR7_Dss
          - name: srr7p-mss-eco
            variant: srr7p
            core: mss
            bazel_target: //software/app/mss/src:aptivMssApp.elf
            coverity_target: srr7p_eco_mss_misrac
            coverity_stream: ADVRADAR_SRR7p_ECO_Mss
            target_variant: awr2944eco
          - name: srr7p-dss-eco
            variant: srr7p
            core: dss
            bazel_target: //software/app/dss/src:aptivDssApp.elf
            coverity_target: srr7p_eco_dss_misrac
            coverity_stream: ADVRADAR_SRR7p_ECO_Dss
            target_variant: awr2944eco
          - name: flr7-mss-eco
            variant: flr7
            core: mss
            bazel_target: //software/app/mss/src:aptivMssApp.elf
            coverity_target: flr7_eco_mss_misrac
            coverity_stream: ADVRADAR_FLR7_ECO_Mss
            target_variant: awr2944eco
          - name: flr7-dss-eco
            variant: flr7
            core: dss
            bazel_target: //software/app/dss/src:aptivDssApp.elf
            coverity_target: flr7_eco_dss_misrac
            coverity_stream: ADVRADAR_FLR7_ECO_Dss
            target_variant: awr2944eco
    uses: Aptiv/workflows-library/.github/workflows/build-analyze-linux.yml@v3
    with:
      runner: ${{ vars.ADVRADAR_RUNNER_MEDIUM_CORERADAR || 'gh-injected-gpo-linux-medium' }}
      pipeline-type: full-build
      build-type: coverity
      analyze-type: coverity
      analyze-targets: ${{ matrix.coverity_target }}
      cov-dir-path: covdir
      scm-type: mono-repo
      gitsubmodules-pull: false
      sarif-enabled: true
      toolchain-cache-enabled: false
      should_skip: ${{ needs.check_skip.outputs.should_skip || 'false' }}
      artifact-name: 'coverity-${{ matrix.name }}'
      additional-artifacts: |
        coverity_build.log
        build_event.json
      script: |
        set -euo pipefail
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        chmod +x ./bazelisk
        # cov-cli consumes the existing AWR cov-bazel configuration. The shared
        # action looks for its conventional root-level filename.
        cp tools/coverity/cov-bazel.toml cov-cli.toml

        BUILD_CMD=(./bazelisk build "${{ matrix.bazel_target }}"
          "--variant=${{ matrix.variant }}"
          --color=yes
          --jobs=auto
          --//:jenkins
          --build_event_json_file=build_event.json)
        if [ -n "${{ matrix.target_variant || '' }}" ]; then
          BUILD_CMD+=("--awr_target_variant=${{ matrix.target_variant }}")
        fi

        echo "**** Coverity Bazel command:"
        printf '%q ' cov-build --dir covdir "${BUILD_CMD[@]}"
        echo
        cov-build --dir covdir "${BUILD_CMD[@]}" 2>&1 | tee coverity_build.log
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      GHCR_USER: ${{ secrets.ADVRADAR_GHCR_USER }}
      GHCR_TOKEN: ${{ secrets.ADVRADAR_GHCR_TOKEN }}
      CONTEXT_SECRETS: >-
        {
          "GERRIT_USER": "${{ secrets.ADVRADAR_SID_USERNAME }}",
          "GERRIT_TOKEN": "${{ secrets.ADVRADAR_SID_GERRIT_HTTP_KEY }}",
          "JFROG_OIDC_PROVIDER": "${{ vars.JFROG_OIDC_PROVIDER }}",
          "JFROG_OIDC_AUDIENCE": "${{ vars.JFROG_OIDC_AUDIENCE }}",
          "ARB_TOKEN": "${{ secrets.ADVRADAR_ARB_TOKEN }}",
          "COVERITY_COMMITTER_AUTH": "${{ secrets.ADVRADAR_COVERITY_COMMITTER_AUTH }}"
        }

  dynamic_analysis:
    name: Dynamic Analysis (asan/ubsan/valgrind)
    needs: [check_skip]
    if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || needs.check_skip.outputs.should_skip != 'true')
    uses: ./.github/workflows/dynamic-analysis.yml
    with:
      pr-number: ${{ github.event.pull_request.number || '' }}
    secrets:
      ADVRADAR_GHCR_USER: ${{ secrets.ADVRADAR_GHCR_USER }}
      ADVRADAR_GHCR_TOKEN: ${{ secrets.ADVRADAR_GHCR_TOKEN }}
      ADVRADAR_NETRC_CONTENT: ${{ secrets.ADVRADAR_NETRC_CONTENT }}
      ADVRADAR_ARB_TOKEN: ${{ secrets.ADVRADAR_ARB_TOKEN }}

  # HW smoke test is intentionally disabled. The Jenkins `integrationJob` runs
  # on a Windows bench (label `GEN7_CICD`); until a runner with the labels in
  # smoke-test.yml registers with GitHub Actions, keep this gated.
  hw_test:
    name: HW Smoke Test (disabled)
    if: false
    needs: [build, check_skip]
    uses: ./.github/workflows/smoke-test.yml
    with:
      commit-sha: ${{ github.event.pull_request.head.sha || inputs.ref || github.sha }}
      pr-number: ${{ github.event.pull_request.number || '' }}
      runner-labels: ${{ inputs.smoke_test_runner || '["self-hosted","windows","SmokeTest","Gen7","AWR294x"]' }}
      matrix-json: |
        [
          {"variant":"srr7p","artifact_name":"awr294x-build-output-srr7p-production","quickflash_variant":"srr7p","smoke_test_report_path":"reports/smoke-srr7p"},
          {"variant":"flr7","artifact_name":"awr294x-build-output-flr7-production","quickflash_variant":"flr7","smoke_test_report_path":"reports/smoke-flr7"}
        ]

  pr_status_end:
    name: PR Status (end)
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs: [check_skip, pr_validation, precommit, dependency_scan, build, unit_test, coverity, dynamic_analysis, hw_test]
    runs-on: gh-injected-gpo-linux-medium
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 1}
      - uses: ./.github/actions/pr-status-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          job-precommit: ${{ needs.precommit.result }}
          job-dependency-scan: ${{ needs.dependency_scan.result }}
          job-build: ${{ needs.build.result }}
          job-unit-test: ${{ needs.unit_test.result }}
          job-coverity: ${{ needs.coverity.result }}
          job-dynamic-analysis: ${{ needs.dynamic_analysis.result }}
          job-hw-test: ${{ needs.hw_test.result }}

  # Required check for branch protection. A skipped documentation-only job is
  # successful for gate purposes; any other completed failure blocks the run.
  ci-status:
    name: CI Status
    needs: [check_skip, pr_validation, precommit, dependency_scan, build, unit_test, coverity, dynamic_analysis, hw_test]
    if: always()
    runs-on: gh-injected-gpo-linux-small
    steps:
      - name: Determine overall job status
        uses: actions/github-script@v8
        with:
          script: |
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100,
            });
            const successful = ['success', 'skipped', 'neutral'];
            const failures = jobs.filter((job) =>
              job.status === 'completed' && !successful.includes(job.conclusion || '')
            );
            if (failures.length) {
              core.setFailed(failures.map((job) => `${job.name} (${job.conclusion || 'unknown'})`).join(', '));
            }
