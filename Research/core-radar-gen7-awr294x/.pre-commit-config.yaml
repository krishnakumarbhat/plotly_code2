repos:
- repo: https://github.com/pre-commit/mirrors-clang-format
  rev: v13.0.1
  hooks:
  - id: clang-format
    name: format C code
    types_or: [c++, c]
    additional_dependencies: [--trusted-host, pypi.org, --trusted-host, pypi.python.org, --trusted-host, files.pythonhosted.org]
    exclude: |
      (?x)^(
          software/app/mss/drivers/soc/awr294x/.*               | # Ti SOC specific files
          software/app/mss/mmic/drivers/ti/.*                   | # Ti MMWaveLink files
          software/app/common/calibrations/smc/.*               | # SMC Autogenerated folder
          software/app/common/calibrations/usc/.*               | # USC Autogenerated folder
          software/app/common/calibrations/psc/.*               | # PSC Autogenerated folder
          software/app/mss/mcal/modules/.*                      | # MCAL Static files from Ti
          software/app/mss/mcal/Workspace/.*                    | # MCAL generated files
          software/boot/mcal/modules/.*                         | # MCAL Static files from Ti
          software/boot/mcal/Workspace/.*                       | # MCAL generated files
          software/boot/ti-arm-clang/.*                         | # Ti Generated files
          software/boot/drivers/soc/awr294x/.*                  | # Ti SOC specific files
          software/boot/kernel/dpl/.*                           | # Ti DPL folder Boot
          software/app/mss/autosar/config/Appl/GenData/.*       | # VECTOR Autosar folder
          software/app/mss/autosar/database/.*                  | # VECTOR Autosar folder
          software/app/mss/autosar/config/Config/.*             | # VECTOR Autosar folder
          software/app/mss/autosar/config/Log/.*                | # VECTOR Autosar folder
          software/FBL/networking/enet/.*/.*                    | # Enet Folder from TI exclude all folders
          software/FBL/networking/lwip/.*/.*                    | # LWIP Folder from TI exclude all folders
          software/FBL/os/freertos/.*/.*                        | # freertos Folder from TI exclude all folders
      )$
-   repo: https://github.com/Warchant/pre-commit-buildifier
    rev: 0.0.2
    hooks:
    -   id: buildifier
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.1.0
  hooks:
  - id: check-merge-conflict
    additional_dependencies: [--trusted-host, pypi.org, --trusted-host, pypi.python.org, --trusted-host, files.pythonhosted.org]
  - id: end-of-file-fixer
    additional_dependencies: [--trusted-host, pypi.org, --trusted-host, pypi.python.org, --trusted-host, files.pythonhosted.org]
    # types_or: [c++, c]
    exclude: |
      (?x)^(
          instrumentation/CANape/.*                                 | # CANape folder
          .*html                                                    | # HTML files
          .*url                                                     | # URL files
          software/.*/mcal/Workspace/.*                             | # MCAL Workspace files
          software/.*/mcal/modules/.*                               | # MCAL Static files from Ti
          software/app/mss/autosar/config/Appl/GenData/.*           | # VECTOR Autosar folder
          software/app/mss/autosar/database/.*                      | # VECTOR Autosar folder
          software/app/mss/autosar/config/Config/.*                 | # VECTOR Autosar folder
          software/app/mss/autosar/config/Log/.*                    | # VECTOR Autosar folder
      )$
  - id: trailing-whitespace
    additional_dependencies: [--trusted-host, pypi.org, --trusted-host, pypi.python.org, --trusted-host, files.pythonhosted.org]
    # types_or: [c++, c]
    exclude: |
      (?x)^(
          instrumentation/CANape/.*                                 | # CANape folder
          .*html                                                    | # HTML files
          .*url                                                     | # URL files
          software/.*/mcal/Workspace/.*                             | # MCAL Workspace files
          software/.*/mcal/modules/.*                               | # MCAL Static files from Ti
          software/app/mss/autosar/config/Appl/GenData/.*           | # VECTOR Autosar folder
          software/app/mss/autosar/database/.*                      | # VECTOR Autosar folder
          software/app/mss/autosar/config/Config/.*                 | # VECTOR Autosar folder
          software/app/mss/autosar/config/Log/.*                    | # VECTOR Autosar folder
      )$
  - id: check-shebang-scripts-are-executable
    additional_dependencies: [--trusted-host, pypi.org, --trusted-host, pypi.python.org, --trusted-host, files.pythonhosted.org]
    # types_or: [c++, c]
    exclude: |
      (?x)^(
          software/app/mss/autosar/config/Appl/GenData/.*       | # VECTOR Autosar folder
          software/app/mss/autosar/database/.*                  | # VECTOR Autosar folder
          software/app/mss/autosar/config/Config/.*             | # VECTOR Autosar folder
          software/app/mss/autosar/config/Log/.*                | # VECTOR Autosar folder
          tools/python/SQTS_Automation_Framework/src/.*         | # Python Framework Lauterbach
      )$
  - id: check-executables-have-shebangs
    additional_dependencies: [--trusted-host, pypi.org, --trusted-host, pypi.python.org, --trusted-host, files.pythonhosted.org]
    # types_or: [c++, c]
    exclude: |
      (?x)^(
          software/app/mss/autosar/config/Appl/GenData/.*       | # VECTOR Autosar folder
          software/app/mss/autosar/database/.*                  | # VECTOR Autosar folder
          software/app/mss/autosar/config/Config/.*             | # VECTOR Autosar folder
          software/app/mss/autosar/config/Log/.*                | # VECTOR Autosar folder
          tools/python/SQTS_Automation_Framework/src/.*         | # Python Framework Lauterbach
      )$
- repo: https://github.com/psf/black
  rev: 22.8.0
  hooks:
  - id: black
    name: "black: format python"
    args: [--config, tools/preCommit/pyproject.toml]
    exclude: |
      (?x)^(
        software/app/mss/networking/enet/core/tools/.*  | # Enet Tools Dir
        tools/python/uniflash/uart_uniflash.py          | # Exclude uart_uniflash.py, since this is delivered by Ti
        tools/python/SQTS_Automation_Framework/.*       | # Exclude python framework
      )$
- repo: https://github.com/pycqa/flake8
  rev: 7.1.1
  hooks:
  - id: flake8
    name: "flake8: lint python"
    args: [--config, tools/preCommit/f8_python.ini]
    types: [python]
    additional_dependencies: [flake8-docstrings, flake8-bugbear, flake8-builtins, flake8-comprehensions]
    exclude: |
      (?x)^(
        software/app/mss/networking/enet/core/tools/.*  | # Enet Tools Dir
        .*__init__.py                                   | # Ignore __init__.py files
        tools/python/uniflash/uart_uniflash.py          | # Exclude uart_uniflash.py, since this is delivered by Ti
        tools/python/SQTS_Automation_Framework/src/.*                     | # Exclude python framework
        tools/python/SQTS_Automation_Framework/Testcases/CANoe/.*         | # Exclude python framework
        tools/python/SQTS_Automation_Framework/Testcases/unit_test/.*     | # Exclude python framework
        tools/python/SQTS_Automation_Framework/Testcases/Trace32/.*       | # Exclude python framework
        tools/python/SQTS_Automation_Framework/flashing_testcases/.*      | # Exclude python framework
        tools/python/SQTS_Automation_Framework/utils/.*                   | # Exclude python framework
        tools/python/SQTS_Automation_Framework/Testcases/power_supply/.*  | # Exclude python framework
      )$
  - id: flake8
    name: "flake8: lint bazel"
    args: [--config, tools/preCommit/f8_bazel.ini]
    types: [bazel]
    additional_dependencies: [flake8-docstrings]
- repo: local
  hooks:
  - id: mh_style
    name: Format Matlab Code
    entry: mh_style
    args: [--process-slx, --fix]
    files: (^(?!Design_Spec/Matlab_simulator_.*)(.*\.(m|slx))$)
    language: python
    additional_dependencies: [miss_hit_core]
    verbose: false
