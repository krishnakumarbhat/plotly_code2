SensorSimulator:
  SimulationDescription: "\n        Configuration: 5 Radar SM2 + 1 Camera SM2\
    \ -> 1 Camera LM2 (Stage2) -> 1 Camera LM2 (Stage3)\n\
    \        Data flow:\n\
    \          Camera SM2 (Model 5) -> Camera LM2 Stage2 (Model 6)\n\
    \          5x Radar SM2 (Model 0-4) + Camera LM2 Stage2 (Model 6) -> Camera LM2 Stage3 (Model 7)\n    "
  Configuration:
    UseCase: SIL
    RunMode: auto
    Defaults:
      LogLevel: InfoAndWarnings
      PerfLogVersion: v1
    PerformanceLogging:
      - Report: FullPipeline
        Start:
          Element: Receiver
          Id: 0
          LogPoint: Entry
        End:
          Element: Sender
          Id: 0
          LogPoint: Exit
      - Report: RadarSM2CalculationTime
        Start:
          Element: Model
          Id: 0
          LogPoint: Entry
        End:
          Element: Model
          Id: 0
          LogPoint: Exit
      - Report: CamLM2Stage2CalculationTime
        Start:
          Element: Model
          Id: 6
          LogPoint: Entry
        End:
          Element: Model
          Id: 6
          LogPoint: Exit
      - Report: CamLM2Stage3CalculationTime
        Start:
          Element: Model
          Id: 7
          LogPoint: Entry
        End:
          Element: Model
          Id: 7
          LogPoint: Exit
    Remote:
      Control:
        Enabled: false
        Ip: 127.0.0.1
        Port: 6363
  ReceiverList:
    - Receiver: 0
      DataType: SensorView
      CommunicationType: zmq
      CommunicationOptions:
        Ip: 127.0.0.1
        Port: 5564
        Pattern: Pub-Sub
        Protocol: TCP
        EpgmLocalIpOrInterface: 127.0.0.1
        EpgmRate: 1000000
      ConnectTo:
        - Element: Model    # Radar SM2 - Front Left
          Id: 0
          InputPort: 0
        - Element: Model    # Radar SM2 - Front Right
          Id: 1
          InputPort: 0
        - Element: Model    # Radar SM2 - Rear Left
          Id: 2
          InputPort: 0
        - Element: Model    # Radar SM2 - Rear Right
          Id: 3
          InputPort: 0
        - Element: Model    # Radar SM2 - Front Center
          Id: 4
          InputPort: 0
        - Element: Model    # Camera SM2 - Front Center
          Id: 5
          InputPort: 0
  SenderList:
    - Sender: 0
      DataType: SensorData
      CommunicationType: zmq
      CommunicationOptions:
        Ip: 127.0.0.1
        Port: 5563
        Pattern: Pub-Sub
        Protocol: TCP
        EpgmLocalIpOrInterface: 127.0.0.1
        EpgmRate: 1000000
    - Sender: 1
      DataType: SensorData
      CommunicationType: zmq
      CommunicationOptions:
        Ip: 127.0.0.1
        Port: 5562
        Pattern: Pub-Sub
        Protocol: TCP
        EpgmLocalIpOrInterface: 127.0.0.1
        EpgmRate: 1000000
  ModelList:
    # ---------------------------------------------------------------
    # Model 0: Radar SM2 — Front Left
    # ---------------------------------------------------------------
    - Model: 0
      ModelType: Sensor
      Scheduler:
        Enabled: true
        StartupDelay:
          Unit: sec
          Value: 0
        Interval:
          Unit: ms
          Value: 50
      FmuArchive:
        Path: /home/pulaksamui/GIT_WSL/Core_RESIM_VV_Engine/fmuZIP/SRR_Master_SensorModel2.fmu
        Origin: config
      FmuLogLevel: Warn
      InputPortList:
        - Port: 0
          DataType: SensorView
          InputVariableName: SensorViewIn
      OutputPortList:
        - Port: 0
          DataType: SensorData
          ConnectTo:
            - Element: Model
              Id: 7
              InputPort: 0
          OutputVariableName: SensorDataOut
      ModelVariables:
        - {Name: SRR.SM2.Customer_enum,                               Type: Integer, Start: 0}
        - {Name: SRR.SM2.SensorType_enum,                             Type: Integer, Start: 8}
        - {Name: SRR.SM2.MaxNumberOfDetections,                       Type: Integer, Start: 500}
        - {Name: SRR.SM2.SensorMountingPosition.Position.X_m,        Type: Real, Start: 2.5}
        - {Name: SRR.SM2.SensorMountingPosition.Position.Y_m,        Type: Real, Start: 1.0}
        - {Name: SRR.SM2.SensorMountingPosition.Position.Z_m,        Type: Real, Start: -0.25}
        - {Name: SRR.SM2.SensorMountingPosition.Orientation.Roll_rad, Type: Real, Start: 0.0}
        - {Name: SRR.SM2.SensorMountingPosition.Orientation.Pitch_rad,Type: Real, Start: 0.0}
        - {Name: SRR.SM2.SensorMountingPosition.Orientation.Yaw_rad,  Type: Real, Start: 1.047198}
        - {Name: SRR.SM2.Traffic.BbCenterToRearXFactor,               Type: Real, Start: 0.8}
        - {Name: SRR.SM2.Traffic.BbCenterToFrontXFactor,              Type: Real, Start: 0.7}
        - {Name: SRR.SM2.Traffic.GroundClearance_m,                   Type: Real, Start: 0.2}
        - {Name: SRR.SM2.Traffic.WheelRadius_m,                       Type: Real, Start: 0.2}
        - {Name: SRR.SM2.Host.Length_m,                               Type: Real, Start: 5.0}
        - {Name: SRR.SM2.Host.Width_m,                                Type: Real, Start: 2.0}
        - {Name: SRR.SM2.Host.Height_m,                               Type: Real, Start: 1.5}
