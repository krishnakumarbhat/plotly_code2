SensorSimulator:
  SimulationDescription: "\n        Configuration file for LiME - Template FMU with\
    \ ZMQ Sender/Receiver for OSI\n    "
  Configuration:
    UseCase: SIL
    RunMode: auto
    Defaults:
      LogLevel: InfoAndWarnings
      PerfLogVersion: v1
    PerformanceLogging:
      - Report: FullPipeline
        Start:
          Element: Receiver
          Id: 0
          LogPoint: Entry
        End:
          Element: Sender
          Id: 0
          LogPoint: Exit
      - Report: SM2CalculationTime
        Start:
          Element: Model
          Id: 0
          LogPoint: Entry
        End:
          Element: Model
          Id: 0
          LogPoint: Exit
      - Report: LM2CalculationTime
        Start:
          Element: Model
          Id: 2
          LogPoint: Entry
        End:
          Element: Model
          Id: 2
          LogPoint: Exit
    Remote:
      Control:
        Enabled: false
        Ip: 127.0.0.1
        Port: 6363
  ReceiverList:
    - Receiver: 0
      DataType: SensorView
      CommunicationType: zmq
      CommunicationOptions:
        Ip: 127.0.0.1
        Port: 5564
        Pattern: Pub-Sub      
        Protocol: TCP
        EpgmLocalIpOrInterface: 127.0.0.1
        EpgmRate: 1000000
      ConnectTo:
        - Element: Model
          Id: 0
          InputPort: 0
        - Element: Model
          Id: 1
          InputPort: 0
        - Element: Model
          Id: 2
          InputPort: 0
        - Element: Model
          Id: 3
          InputPort: 0
        - Element: Model
          Id: 4
          InputPort: 0
        - Element: Model
          Id: 5
          InputPort: 0
        - Element: Model
          Id: 6
          InputPort: 0
        - Element: Model
          Id: 7
          InputPort: 0
        - Element: Model
          Id: 8
          InputPort: 0
        - Element: Model
          Id: 9
          InputPort: 0
        - Element: Model
          Id: 10
          InputPort: 0
        - Element: Model
          Id: 11
          InputPort: 0
  SenderList:
    - Sender: 0
      DataType: SensorData
      CommunicationType: zmq
      CommunicationOptions:
        Ip: 127.0.0.1
        Port: 5563
        Pattern: Pub-Sub      
        Protocol: TCP
        EpgmLocalIpOrInterface: 127.0.0.1
        EpgmRate: 1000000
    - Sender: 1
      DataType: SensorData
      CommunicationType: zmq
      CommunicationOptions:
        Ip: 127.0.0.1
        Port: 5562
        Pattern: Pub-Sub      
        Protocol: TCP
        EpgmLocalIpOrInterface: 127.0.0.1
        EpgmRate: 1000000
    - Sender: 2
      DataType: SensorData
      CommunicationType: zmq
      CommunicationOptions:
        Ip: 127.0.0.1
        Port: 5561
        Pattern: Pub-Sub      
        Protocol: TCP
        EpgmLocalIpOrInterface: 127.0.0.1
        EpgmRate: 1000000
    - Sender: 3
      DataType: SensorData
      CommunicationType: zmq
      CommunicationOptions:
        Ip: 127.0.0.1
        Port: 5560
        Pattern: Pub-Sub      
        Protocol: TCP
        EpgmLocalIpOrInterface: 127.0.0.1
        EpgmRate: 1000000
    - Sender: 4
      DataType: SensorData
      CommunicationType: zmq
      CommunicationOptions:
        Ip: 127.0.0.1
        Port: 5560
        Pattern: Pub-Sub      
