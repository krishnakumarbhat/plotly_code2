    \        !!!                        PURE TEST FILE                           \
    \ !!!\n        !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!\n\
    \        ! This file is represents the minimum valid configuration for a     \
    \   !\n        ! multi input and multi output sensor version of the LiME.    \
