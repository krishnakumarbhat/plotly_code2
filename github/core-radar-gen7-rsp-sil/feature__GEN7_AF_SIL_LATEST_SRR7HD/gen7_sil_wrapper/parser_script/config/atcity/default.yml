network-kind: at-city-bmw-mrr360
network:
  preprocessing:
    batch-logic: Pivot
    pivot-indices: [0, 1]
    normalization: normalized
    egomotion-method: Interpolated
    sensor-map:
      - identifier: AtCityBMW_FL_Radar
        rtype: mrr360
        range-box:
          forward: 80.0
          backward: 60.0
          left: 40.0
          right: 40.0
      - identifier: AtCityBMW_RR_Radar
        rtype: mrr360
        range-box:
          forward: 80.0
          backward: 60.0
          left: 40.0
          right: 40.0
      - identifier: AtCityBMW_FR_Radar
        rtype: mrr360
        range-box:
          forward: 80.0
          backward: 60.0
          left: 40.0
          right: 40.0
      - identifier: AtCityBMW_RL_Radar
        rtype: mrr360
        range-box:
          forward: 80.0
          backward: 60.0
          left: 40.0
          right: 40.0

  python-tensorflow:
    path: ./runtime_data/network.py
    class: Network
    model: config/atcity/detection/network.pb
    interface: config/atcity/detection/interface.json
  postprocessing:
    score-threshold: 0.2
    nms-threshold: 0.1
    nms-method: overlap-classwise
    classwise:
      0:
        name: Bike
        score-threshold: 0.2
        height: 1.5
      1:
        name: Large_Moving
        score-threshold: 0.2
        height: 2.5
      2:
        name: Large_Stationary
        score-threshold: 0.2
        height: 2.5
      3:
        name: Other
        score-threshold: 2.0
        height: 5.0
      4:
        name: Pedestrian
        score-threshold: 0.2
        height: 1.8
      5:
        name: Vehicle_Moving
        score-threshold: 0.2
        height: 1.5
      6:
        name: Vehicle_Stationary
        score-threshold: 0.2
        height: 1.5

tracker: config/atcity/detection/tracker_params.json
