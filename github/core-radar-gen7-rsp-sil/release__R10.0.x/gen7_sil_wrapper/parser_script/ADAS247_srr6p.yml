    FrontLeftRadar:
      port: 5555
      remote: 192.168.1.71:49154
      type: radar-sensor
      radar-type: SRR6P
      extrinsics:
         position:
           x: 20
           y: 0
           z: -0.406
         rotation:
           w: 0
           x: 0.989
           y: 0
           z: 0

