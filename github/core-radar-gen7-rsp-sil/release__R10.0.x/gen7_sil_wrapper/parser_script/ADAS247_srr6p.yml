logging:
  ethernet:
    interfaces:
      #put your netwrok device here
      - interface: enp0s3
        udp:
          - 2368
          - 5555
          - 10110
        tcp:
          - ip: 192.168.1.51
            port: 9870
            timeout: 10
          - ip: 192.168.1.51
            port: 9347
            timeout: 10
  can:
    interfaces:
      - name: can4
        channel: 4
        is-fd: false
      - name: can5
        channel: 5
        is-fd: false
  chunk-options:
    duration: 60
    out-directory: mylogging

xviz:
  port: 9000
  message-format: BINARY

