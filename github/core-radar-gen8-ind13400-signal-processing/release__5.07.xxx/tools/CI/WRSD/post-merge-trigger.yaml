name: core-radar-gen8-spbb-post-merge-trigger
when:
  eventSource: gerrit
  eventTypes:
    - change-merged
  filters:
    - property: change.branch
      operator: in
      values:
        - dev
run:
  pipeline: core-radar-bb-post-merge
  params:
    change-id: $(body.change.number)
    commit-id: $(body.patchSet.revision)
    gerrit-project: Core_Radar_Gen8_iND13400_Signal_Processing
    owner-email: $(body.submitter.email),$(body.change.owner.email)
  tasks:
    - name: update-triggers
      enabled: true
url: https://389177498442.awsaptiv.com/webhook/triggers/core-radar-gen8-spbb-post-merge-trigger
