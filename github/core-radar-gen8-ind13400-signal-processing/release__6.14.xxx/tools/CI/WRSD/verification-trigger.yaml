name: core-radar-gen8-spbb-verification-trigger
when:
  eventSource: gerrit
  eventTypes:
    - patchset-created
    - ref-updated
  filters:
    - property: change.branch
      operator: in
      values:
        - dev
        - release/4.13.xxx
        - release/01.01.xxx
        - release/2.01.xxx
        - feature/b0plus_bringup
        - release/5.07.xxx
run:
  pipeline: core-radar-bb-verification
  params:
    build-job-name: core-radar-flr8-bb-build
    build-parent-bb-bazel-name: spbb
    build-parent-project: Core_Radar_Gen8_iND13400
    build-parent-target: //:gen8
    gerrit-change-id: $(body.change.number)
    gerrit-commit-id: $(body.patchSet.revision)
    gerrit-project: Core_Radar_Gen8_iND13400_Signal_Processing
    unit-test-target-pipeline: NA
    unit-test-yaml-path: NA
    upload-path: NA
  tasks:
    - name: build
      enabled: true
    - name: unit-tests
      enabled: false
url: https://389177498442.awsaptiv.com/webhook/triggers/core-radar-gen8-spbb-verification-trigger
