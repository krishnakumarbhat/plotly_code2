name: core-radar-s32r47-spbb-trigger-verification
when:
  eventSource: gerrit
  eventTypes:
    - patchset-created
    - ref-updated
  filters:
    - property: change.branch
      operator: in
      values:
        - dev
        - feature/Range_Testing
run:
  pipeline: core-radar-bb-verification
  params:
    bb-build-job-name: core-radar-gen8-spbb-build
    build-job-name: core-radar-flr8-bb-build
    build-parent-bb-bazel-name: spbb
    build-parent-project: Core_Radar_Gen8_S32R47
    build-parent-target: //:gen8
    build-variants: NA
    branch: $(body.change.branch)
    gerrit-change-id: $(body.change.number)
    gerrit-commit-id: $(body.patchSet.revision)
    gerrit-project: Core_Radar_Gen8_S32R47_Signal_Processing
    unit-test-job-name: core-radar-bb-ut
    unit-test-target: //coverage:report
    upload-path: core_radar-aptiv-00000000-building_blocks-local/wrsd/verification/
  tasks:
    - name: build
      enabled: false
    - name: unit-tests
      enabled: false
url: https://389177498442.awsaptiv.com/webhook/triggers/core-radar-s32r47-spbb-trigger-verification
