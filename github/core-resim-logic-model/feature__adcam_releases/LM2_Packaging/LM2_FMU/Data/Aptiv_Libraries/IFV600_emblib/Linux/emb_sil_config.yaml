version: {major: 1, minor: 0}

project: {name: ifv600_emb_lib}

# The following parameters control the flow of execution inside ifv600_emb_sil
parameters:
  # Selects the input data source for CAN receive processing
  # MUDP_STREAM : Collects CAN messages from a UDP stream
  # CANRX_STREAM : Collects CAN messages from a CAN RX stream provided externally as a structure
  # CANRX_FILE   : Reads CAN messages from a CAN mf4 file and runs PLP sync
  can_rx_source: "MUDP_STREAM"  
  # enable or disable the debug messages in the console output
  print_debug_messages: true
  # Selects the execution mode: 0 for Live mode, 1 for Dspace mode
  execution_mode: 1
  # copy IW outputs from mudp : true if you want to copy the IW outputs from mudp, false if you want to use the Rte buffers
  copy_iw_outputs_from_mudp: false
  # enable or disable writing binary files
  bin_file_write: true

variant_manager_inputs:
  # The following variables are required for the flow if copy_iw_outputs_from_mudp is set to false
  # But these values will be populated regarless of the copy_iw_outputs_from_mudp value
  # The below vars were not found from MUDP stream, hence by default update is set to true 
  AEB_Rating_Program: {value: 0, update: true, type: "int"}
  AEB_Regulation: {value: 1, update: true, type: "int"}
  AEB_Turning_VEH: {value: 0, update: true, type: "int"}
